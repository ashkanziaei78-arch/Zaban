<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F3E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A17" media="(prefers-color-scheme: dark)">
<title>تاکورا | سوپرادمین پلتفرم</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232C5A4A'/%3E%3Ctext x='32' y='45' font-size='34' font-family='Tahoma,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E%D8%A7%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/dana-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dana-bold.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ═══════════════════════════════════════════════════════════
   TALKORA — سوپرادمین پلتفرم (admin.talkora.ir)
   عمداً از پنل آموزشگاه‌ها و از سایت معرفی جداست: نشست جدا، رمز جدا،
   زیردامنهٔ جدا. زبان طراحی همان پنل محصول قدیمی است — رنگ سرمه‌ای
   تیره — تا هیچ‌وقت با پنل آبیِ آموزشگاه اشتباه نشود.
   ═══════════════════════════════════════════════════════════ */

@font-face{font-family:"Dana";src:url("fonts/dana-light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Dana";src:url("fonts/dana-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Dana";src:url("fonts/dana-bold.woff2") format("woff2");font-weight:700;font-display:swap}

:root{
  --paper:#F7F3E8; --surface:#FCFAF3; --surface-2:#F1EBDC; --surface-3:#E7E0CE;
  --ink:#24352F; --ink-2:#46574F; --ink-3:#6B7C74;
  --line:#DDE5DC; --line-2:#C6D2C6;
  --brand:#2C5A4A; --brand-2:#3F7D68; --brand-soft:#C9EDE1; --brand-mid:#A9DDC9; --accent-ink:#8A6520; --ring:rgba(63,125,104,.3);
  --ok:#1F7A52; --ok-soft:#DCF0E6;
  --warn:#8A6520; --warn-soft:#F6EBD5;
  --bad:#A83A2C; --bad-soft:#F7E3DF;
  --r1:9px; --r2:14px;
  --sh:0 1px 2px rgba(36,53,47,.05),0 2px 8px rgba(36,53,47,.05);
  --sh-l:0 22px 56px rgba(36,53,47,.18);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#131A17; --surface:#1B2420; --surface-2:#222D28; --surface-3:#2B3832;
  --ink:#ECF2EE; --ink-2:#BFCCC5; --ink-3:#8E9E96;
  --line:#2B3832; --line-2:#3A4A42;
  --brand:#C9EDE1; --brand-2:#A9DDC9; --brand-soft:#1E322A; --brand-mid:#6FAF95; --accent-ink:#E8C98F; --ring:rgba(169,221,201,.34);
  --ok:#7FD1AC; --ok-soft:#17332A;
  --warn:#E0B96A; --warn-soft:#2E2718;
  --bad:#F0897E; --bad-soft:#34201D;
  --sh:0 1px 2px rgba(0,0,0,.45); --sh-l:0 22px 56px rgba(0,0,0,.62);
}}
:root[data-theme="dark"]{
  --paper:#131A17; --surface:#1B2420; --surface-2:#222D28; --surface-3:#2B3832;
  --ink:#ECF2EE; --ink-2:#BFCCC5; --ink-3:#8E9E96;
  --line:#2B3832; --line-2:#3A4A42;
  --brand:#C9EDE1; --brand-2:#A9DDC9; --brand-soft:#1E322A; --brand-mid:#6FAF95; --accent-ink:#E8C98F; --ring:rgba(169,221,201,.34);
  --ok:#7FD1AC; --ok-soft:#17332A;
  --warn:#E0B96A; --warn-soft:#2E2718;
  --bad:#F0897E; --bad-soft:#34201D;
  --sh:0 1px 2px rgba(0,0,0,.45); --sh-l:0 22px 56px rgba(0,0,0,.62);
}
:root[data-theme="light"]{
  --paper:#F7F3E8; --surface:#FCFAF3; --surface-2:#F1EBDC; --surface-3:#E7E0CE;
  --ink:#24352F; --ink-2:#46574F; --ink-3:#6B7C74;
  --line:#DDE5DC; --line-2:#C6D2C6;
  --brand:#2C5A4A; --brand-2:#3F7D68; --brand-soft:#C9EDE1; --brand-mid:#A9DDC9; --accent-ink:#8A6520;
  --ok:#1F7A52; --ok-soft:#DCF0E6; --warn:#8A6520; --warn-soft:#F6EBD5;
  --bad:#A83A2C; --bad-soft:#F7E3DF;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Dana",system-ui,Tahoma,sans-serif;background:var(--paper);color:var(--ink);
     font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:where(button){background:none;border:none;padding:0;color:inherit}
input,select,textarea{font:inherit}
a{color:var(--brand-2)}

/* ── چیدمان ── */
.shell{display:grid;grid-template-columns:236px 1fr;min-block-size:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);
      display:flex;flex-direction:column;position:sticky;top:0;block-size:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;
       border-block-end:1px solid var(--line);font-weight:700}
.brand i{inline-size:32px;block-size:32px;border-radius:9px;background:var(--brand);color:#fff;
         display:grid;place-content:center;font-size:16px;font-style:normal}
:root[data-theme="dark"] .brand i,
@media (prefers-color-scheme:dark){.brand i{color:#131A17}}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);line-height:1.4}
nav{padding:10px 8px;flex:1;overflow:auto}
nav button{display:flex;align-items:center;gap:9px;inline-size:100%;text-align:start;
           padding:9px 11px;border-radius:var(--r1);font-size:14px;color:var(--ink-2);margin-block-end:2px}
nav button:hover{background:var(--surface-2)}
nav button.on{background:var(--brand-soft);color:var(--brand-2);font-weight:700}
nav .grp{font-size:11px;color:var(--ink-3);padding:14px 11px 5px;font-weight:700;letter-spacing:.02em}
.side-f{padding:12px;border-block-start:1px solid var(--line);display:flex;gap:8px;align-items:center}
.side-f .who{flex:1;min-inline-size:0;font-size:13px}
.side-f .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-f .who span{color:var(--ink-3);font-size:11.5px}

.main{min-inline-size:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--surface);
     border-block-end:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;flex:1}
.page{padding:22px;max-inline-size:1120px;inline-size:100%}

.demo-bar{background:var(--warn-soft);color:var(--warn);border-block-end:1px solid var(--line);
          font-size:12.5px;padding:9px 18px;text-align:center}
.demo-bar b{color:inherit}

/* ── اجزا ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
      box-shadow:var(--sh);margin-block-end:16px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-block-end:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;flex:1}
.card-b{padding:18px}
.hint{display:block;font-size:12.5px;color:var(--ink-3);margin-block-start:5px;line-height:1.7}
.muted{color:var(--ink-3)}
.back{font-size:13px;color:var(--brand-2);margin-block-end:12px;display:inline-flex;align-items:center;gap:5px}

.grid{display:grid;gap:14px}
.grid>*{min-inline-size:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:15px 16px}
.kpi .l{font-size:12.5px;color:var(--ink-3)}
.kpi .v{font-size:25px;font-weight:700;line-height:1.35;margin-block-start:3px}
.kpi .d{font-size:12.5px;color:var(--ink-3)}

.fld{margin-block-end:15px}
.fld .rq{color:var(--bad)}
.row{display:flex;flex-wrap:wrap}
.au-err{margin-block:2px 14px;padding:10px 12px;border-radius:10px;font-size:13.5px;
  background:var(--bad-soft);color:var(--bad);border:1px solid currentColor}
.seg-picks{display:flex;flex-wrap:wrap;gap:8px}
.jsel{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:7px}
.jsel select{inline-size:100%}
/* ── ویرایشگر وبلاگ ── */
.ed-bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:7px 8px;
  border:1px solid var(--line-2);border-block-end:none;
  border-radius:10px 10px 0 0;background:var(--surface-2)}
.ed-bar button{padding:6px 11px;border-radius:7px;font-size:12.5px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer}
.ed-bar button:hover{border-color:var(--brand-2);color:var(--ink)}
.ed-bar .sep{inline-size:1px;block-size:20px;background:var(--line-2);margin-inline:4px}
.ed{min-block-size:340px;max-block-size:60vh;overflow-y:auto;padding:16px 18px;
  border:1px solid var(--line-2);border-radius:0 0 10px 10px;background:var(--surface);
  line-height:2;font-size:15px}
.ed:focus{outline:none;border-color:var(--brand-2)}
.ed h2{font-size:21px;padding-block:14px 6px}
.ed h3{font-size:18px;padding-block:12px 5px}
.ed p{padding-block-end:11px}
.ed ul,.ed ol{padding-inline-start:26px;padding-block-end:11px}
.ed li{padding-block-end:4px}
.ed blockquote{border-inline-start:3px solid var(--brand-2);padding-inline-start:14px;
  margin-block:12px;color:var(--ink-2)}
.ed img{max-inline-size:100%;height:auto;border-radius:8px;margin-block:8px}
.ed a{color:var(--brand-2)}
.cover-pick{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.cover-prev{inline-size:190px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;
  border:1px solid var(--line-2);flex:none}
.empty-prev{display:grid;place-items:center;background:var(--surface-2);
  color:var(--ink-3);font-size:12.5px}
.seo{border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  margin-block:6px 14px;background:var(--surface-2)}
.seo summary{cursor:pointer;font-weight:700;font-size:14px}
.jsel select{inline-size:100%}
.aud{padding:9px 13px;border:1.5px solid var(--line-2);border-radius:10px;text-align:start;
  background:var(--surface);font:inherit;color:inherit;cursor:pointer}
.aud:hover:not([disabled]){border-color:var(--brand-2)}
.aud[disabled]{opacity:.45;cursor:not-allowed}
.aud.on{border-color:var(--brand-2);background:var(--brand-soft)}
.aud b{display:block;font-size:13.5px}
.aud small{display:block;font-size:11.5px;color:var(--ink-3);margin-block-start:2px}
.kind-picks{display:flex;gap:7px;flex-wrap:wrap}
.kind{padding:8px 15px;border:1.5px solid var(--line-2);border-radius:100px;background:var(--surface);
  font:inherit;font-size:13px;color:var(--ink-3);cursor:pointer}
.kind:hover{border-color:var(--brand-2)}
.kind.on{font-weight:700;border-color:currentColor}
.kind.on.nk-info{background:var(--surface-2);color:var(--ink)}
.kind.on.nk-success{background:var(--ok-soft);color:var(--ok)}
.kind.on.nk-warn{background:var(--warn-soft);color:var(--warn)}
.kind.on.nk-urgent{background:var(--bad-soft);color:var(--bad)}
.ntf-i{display:inline-grid;place-items:center;inline-size:22px;block-size:22px;border-radius:50%;
  font-size:11.5px;font-weight:700;margin-inline-end:6px;vertical-align:-4px}
.nk-info{background:var(--surface-2);color:var(--ink)}
.nk-ok{background:var(--ok-soft);color:var(--ok)}
.nk-warn{background:var(--warn-soft);color:var(--warn)}
.nk-bad{background:var(--bad-soft);color:var(--bad);font-size:10.5px;letter-spacing:-1px}
.fld label{display:block;font-size:13.5px;font-weight:700;margin-block-end:6px}
.fld input,.fld select,.fld textarea{inline-size:100%;padding:10px 12px;border:1px solid var(--line-2);
  border-radius:var(--r1);background:var(--surface);color:var(--ink);min-block-size:44px}
.fld textarea{min-block-size:90px;resize:vertical;line-height:1.8}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand-2);
  box-shadow:0 0 0 3px var(--ring)}
.rq{color:var(--bad)}
.search{display:flex;gap:10px;margin-block-end:16px}
.search .fld{flex:1;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;
     border-radius:var(--r1);font-weight:700;font-size:14px;min-block-size:44px;border:1px solid transparent}
.btn--p{background:var(--brand-2);color:#fff}
.btn--p:hover{filter:brightness(1.07)}
.btn--g{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--g:hover{background:var(--surface-2)}
.btn--d{background:var(--bad-soft);color:var(--bad);border-color:currentColor}
.btn--sm{padding:6px 11px;min-block-size:34px;font-size:13px}
.btn--b{inline-size:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:12px;font-weight:700}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--brand-soft);color:var(--brand-2)}
.p-mute{background:var(--surface-2);color:var(--ink-3)}

.tbl-wrap{overflow-x:auto}
table{inline-size:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;padding:10px 14px;background:var(--surface-2);color:var(--ink-3);
   font-size:12px;font-weight:700;white-space:nowrap}
td{padding:11px 14px;border-block-start:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}

.empty{padding:38px 22px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-block-end:5px}

.note{padding:12px 14px;border-radius:var(--r1);font-size:13.5px;line-height:1.8;margin-block-end:14px}
.note--i{background:var(--brand-soft);color:var(--ink-2);border:1px solid var(--line)}
.note--w{background:var(--warn-soft);color:var(--warn);border:1px solid currentColor}
.note--e{background:var(--bad-soft);color:var(--bad);border:1px solid currentColor}
.note--k{background:var(--ok-soft);color:var(--ok);border:1px solid currentColor}

/* ── ورود ── */
.login{min-block-size:100vh;display:grid;place-content:center;justify-items:center;padding:24px}
.login .box{inline-size:min(410px,100%);background:var(--surface);border:1px solid var(--line);
            border-radius:var(--r2);padding:30px 26px;box-shadow:var(--sh-l)}
.login h1{font-size:21px;margin:0 0 6px}
.login p.sub{color:var(--ink-3);font-size:13.5px;margin:0 0 22px;line-height:1.8}
.login .mark{inline-size:48px;block-size:48px;border-radius:14px;background:var(--brand);color:#fff;
             display:grid;place-content:center;font-size:22px;font-weight:700;margin-block-end:16px}

/* ── نوار پیام ── */
.toasts{position:fixed;inset-block-end:20px;inset-inline-start:20px;z-index:80;display:flex;
        flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r1);
       font-size:13.5px;box-shadow:var(--sh-l);animation:up .22s}
@keyframes up{from{opacity:0;transform:translateY(8px)}}

.boot{position:fixed;inset:0;z-index:90;display:grid;place-content:center;background:var(--paper)}

/* ── گفتگوی دلیل (impersonate / تعلیق) ── */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,18,.5);z-index:70;display:grid;place-items:center;padding:20px}
.modal{inline-size:min(440px,100%);background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh-l);
       border:1px solid var(--line)}
.modal .card-b{padding:20px}

@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;block-size:auto;border-inline-end:none;border-block-end:1px solid var(--line)}
  nav{display:flex;flex-wrap:wrap;gap:4px}
  nav button{inline-size:auto}
  nav .grp{display:none}
  .page{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<div class="boot" id="boot"><span class="muted">در حال بارگذاری…</span></div>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ══════════ کمکی‌ها ══════════ */
var FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function fa(n){return String(n).replace(/[0-9]/g,function(d){return FA[+d];});}
function faG(n){return fa(String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"٬"));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}
function enDigits(s){return String(s)
  .replace(/[۰-۹]/g,function(d){return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d));})
  .replace(/[٠-٩]/g,function(d){return String("٠١٢٣٤٥٦٧٨٩".indexOf(d));});}

var J_M=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function toJalali(gy,gm,gd){
  var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+(~~((gy2+3)/4))-(~~((gy2+99)/100))+(~~((gy2+399)/400))-80+gd+gdm[gm-1];
  jy+=33*(~~(days/12053)); days%=12053;
  jy+=4*(~~(days/1461));   days%=1461;
  if(days>365){jy+=~~((days-1)/365); days=(days-1)%365;}
  var jm=(days<186)?1+~~(days/31):7+~~((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
/* ── شمسی → میلادی ──
 *
 * پنل سوپرادمین تا امروز فقط تاریخ *نمایش* می‌داد، پس toJalali تنها
 * چیزی بود که لازم داشت. بازهٔ قرارداد اولین جایی است که اینجا تاریخ
 * *گرفته* می‌شود، و ورودی شمسی است (بند P.2) در حالی که ستون میلادی
 * است. این سه تابع همان مسیر برگشت‌اند.
 */
var J_MONTHS_S=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور",
                "مهر","آبان","آذر","دی","بهمن","اسفند"];
function pad2(n){return n<10?"0"+n:""+n;}
function isJLeapS(jy){var r=((jy%33)+33)%33;
  return r===1||r===5||r===9||r===13||r===17||r===22||r===26||r===30;}
function jMonthLenS(jy,jm){return jm<=6?31:(jm<=11?30:(isJLeapS(jy)?30:29));}
function fromJalaliS(jy,jm,jd){
  var gy=(jy<=979)?621:1600;
  jy-=(jy<=979)?0:979;
  var days=365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+78+jd
         +((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  gy+=400*~~(days/146097); days%=146097;
  if(days>36524){gy+=100*~~(--days/36524); days%=36524; if(days>=365)days++;}
  gy+=4*~~(days/1461); days%=1461;
  if(days>365){gy+=~~((days-1)/365); days=(days-1)%365;}
  var gd=days+1;
  var ml=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm; for(gm=0; gm<13 && gd>ml[gm]; gm++) gd-=ml[gm];
  return gy+"-"+pad2(gm)+"-"+pad2(gd);
}

/*
 * سه انتخابگرِ روز/ماه/سال به‌جای تقویم کامل.
 *
 * تقویمِ پنل چند صد خط است و اینجا فقط دو تاریخ گرفته می‌شود. سه
 * کشویی همان کار را می‌کند، روی موبایل هم بهتر است، و هیچ حالت
 * نامعتبری نمی‌سازد چون روزها از خودِ ماه و سال می‌آیند.
 */
function jSelects(prefix, iso, fromYear){
  var j=null;
  if(iso){var m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
          if(m)j=toJalali(+m[1],+m[2],+m[3]);}
  var now=new Date(), tj=toJalali(now.getFullYear(),now.getMonth()+1,now.getDate());
  var y0=fromYear||(tj[0]-1);
  var days=j?jMonthLenS(j[0],j[1]):31;
  function opt(v,t,on){return '<option value="'+v+'"'+(on?" selected":"")+'>'+t+'</option>';}
  var d="",mo="",yr="";
  for(var i=1;i<=days;i++)   d+=opt(i,fa(i),j&&j[2]===i);
  for(var i=0;i<12;i++)      mo+=opt(i+1,J_MONTHS_S[i],j&&j[1]===i+1);
  for(var i=y0;i<=y0+12;i++) yr+=opt(i,fa(i),j&&j[0]===i);
  return '<div class="jsel">'
       + '<select id="'+prefix+'D" data-jsel="'+prefix+'"><option value="">روز</option>'+d+'</select>'
       + '<select id="'+prefix+'M" data-jsel="'+prefix+'"><option value="">ماه</option>'+mo+'</select>'
       + '<select id="'+prefix+'Y" data-jsel="'+prefix+'"><option value="">سال</option>'+yr+'</select>'
       + '</div>';
}

/** مقدار میلادی سه انتخابگر، یا رشتهٔ خالی */
function jSelVal(prefix){
  function v(i){var n=el(prefix+i); return n?+n.value:0;}
  var d=v("D"), m=v("M"), y=v("Y");
  if(!d||!m||!y)return "";
  return fromJalaliS(y,m,Math.min(d,jMonthLenS(y,m)));
}

function jDateTime(s){
  if(!s)return "—";
  var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m)return "—";
  var j=toJalali(+m[1],+m[2],+m[3]);
  var t=String(s).match(/(\d{2}):(\d{2})/);
  return fa(j[2])+" "+J_M[j[1]-1]+" "+fa(j[0])+(t?"، "+fa(t[1]+":"+t[2]):"");
}

function toast(msg){
  var d=document.createElement("div");
  d.className="toast"; d.textContent=msg;
  el("toasts").appendChild(d);
  setTimeout(function(){d.remove();},4200);
}

function withTimeout(promise,ms){
  return new Promise(function(resolve){
    var done=false;
    var t=setTimeout(function(){if(!done){done=true;resolve(null);}},ms);
    promise.then(function(v){if(!done){done=true;clearTimeout(t);resolve(v);}},
                 function(){if(!done){done=true;clearTimeout(t);resolve(null);}});
  });
}

        <div class="fld"><label for="ufInst">آموزشگاه</label>
          <select id="ufInst">
            <option value="">همه</option>

                   + esc(i.name)+'</option>';}).join("")}

  ${S.userResults===null?'<div class="card"><div class="empty">در حال بارگذاری…</div></div>':

        ${narrowed?'<p>پالایه‌ها را باز کنید تا همهٔ کاربران دیده شوند.</p>':""}</div></div>`:
    h`<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>نام</th><th>موبایل</th><th>نقش</th><th>آموزشگاه</th>
                 <th>آخرین ورود</th><th>وضعیت</th><th></th></tr></thead>
      <tbody>${S.userResults.map(function(u){
        return h`<tr class="click" data-openuser="${u.id}">
          <td><b>${esc(u.name)}</b>
            <br><span class="muted" style="font-size:11.5px">از ${jDateTime(u.createdAt)}</span></td>
          <td class="num" dir="ltr" style="text-align:end">${fa(u.phone)}</td>
          <td>${(u.roles||[]).length
                ? u.roles.map(function(r){
                    return '<span class="pill p-mute">'+esc(ROLE_FA[r]||r)+'</span>';}).join(" ")

/* کارت آمار کوچک — همان شکلِ بقیهٔ پنل، بدون وابستگی به kpi() پنل مدیر */
function suKpi(label,n,hint){
  return h`<div class="card" style="padding:14px 16px">
    <div class="muted" style="font-size:12.5px">${esc(label)}</div>
    <div class="num" style="font-size:24px;font-weight:700;line-height:1.4">${fa(n)}</div>

}


/* ── اعطا و سلب موردی روی یک کاربر ──
 *
 * بستهٔ نقش کف دسترسی است؛ این پنل استثناها را می‌سازد. دو حالت دارد:
 * allow برای دادن چیزی که نقشش ندارد، deny برای گرفتن چیزی که دارد.
 * سلب همیشه برنده است — حتی بر اعطای صریح — و این قاعده در موتور
 * اعمال می‌شود، نه اینجا.
 */
function accessPanel(d){
  if(!d.overrides&&!d.memberships)return "";
  var cat=S.access;
  var ovr=d.overrides||[];
  var mem=(d.memberships||[]).filter(function(m){return m.status==="active";});
  if(!mem.length)return "";

  return h`
  <div class="card" style="margin-block-end:16px">
    <div class="card-h"><h3>دسترسی‌های موردی</h3>
      <span class="muted" style="font-size:12.5px">فراتر یا کمتر از بستهٔ نقش</span></div>
    <div class="card-b">
      ${ovr.length? h`<div class="tbl-wrap"><table>
        <thead><tr><th>آموزشگاه</th><th>مجوز</th><th>اثر</th><th>تا</th><th></th></tr></thead>
        <tbody>${ovr.map(function(o){
          return h`<tr>
            <td>${esc(o.institute)}</td>
            <td>${esc(o.label)}<br><span class="muted" dir="ltr" style="font-size:11.5px">${esc(o.perm)}</span></td>
            <td>${o.effect==="allow"
                  ? '<span class="pill p-ok">اعطا'+(o.scope?" · "+(SCOPE_FA[o.scope]||o.scope):"")+'</span>'
                  : '<span class="pill p-bad">سلب</span>'}</td>
            <td class="num">${o.expiresAt?jDateTime(o.expiresAt):"بی‌پایان"}</td>
            <td><button class="btn btn--g btn--sm" data-a="permClear" data-uid="${d.user.id}"
                        data-iid="${o.instituteId}" data-perm="${esc(o.perm)}">برداشتن</button></td>
          </tr>`;}).join("")}
        </tbody></table></div>`
        : '<div class="empty" style="padding:14px">استثنایی ثبت نشده — این کاربر دقیقاً همان چیزی را دارد که نقشش می‌دهد.</div>'}

      <div style="margin-block-start:16px;padding-block-start:16px;border-block-start:1px solid var(--line)">
        <div class="grid g4" style="align-items:end">
          <div class="fld"><label>آموزشگاه</label>
            <select id="apInst">${mem.map(function(m){
              return '<option value="'+m.instituteId+'">'+esc(m.institute)+' · '+esc(m.role)+'</option>';}).join("")}</select></div>
          <div class="fld"><label>مجوز</label>
            <select id="apPerm">${cat
              ? cat.permissions.filter(function(x){return !x.platform;}).map(function(x){
                  return '<option value="'+x.key+'">'+esc(x.label)+'</option>';}).join("")
              : '<option value="">اول صفحهٔ نقش‌ها را باز کنید</option>'}</select></div>
          <div class="fld"><label>محدوده</label>
            <select id="apScope">${(cat&&cat.scopes||["own","institute"]).map(function(x){
              return '<option value="'+x+'">'+(SCOPE_FA[x]||x)+'</option>';}).join("")}</select></div>
          <div class="fld"><label>روز (۰ = بی‌پایان)</label>
            <input id="apDays" type="text" inputmode="numeric" value="0"></div>
        </div>
        <div style="display:flex;gap:8px;margin-block-start:10px">
          <button class="btn btn--p btn--sm" data-a="permAllow" data-uid="${d.user.id}">اعطا</button>
          <button class="btn btn--d btn--sm" data-a="permDeny"  data-uid="${d.user.id}">سلب</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ── فرم‌های تنظیمات سایت (پورت از پنل قدیمی) ── */
function setField(key,label,hint,type){
  var v=S.settings?S.settings[key]:"";
  if(type==="textarea"){
    return h`<div class="fld"><label for="f_${key}">${label}</label>
      <textarea id="f_${key}" data-k="${key}" dir="auto">${esc(v)}</textarea>
      ${hint?'<span class="hint">'+hint+'</span>':""}</div>`;
  }
  if(type==="toggle"){
    return h`<div class="fld"><label for="f_${key}">${label}</label>
      <select id="f_${key}" data-k="${key}">
        <option value="1"${v==="1"?" selected":""}>روشن</option>
        <option value="0"${v!=="1"?" selected":""}>خاموش</option></select>
      ${hint?'<span class="hint">'+hint+'</span>':""}</div>`;
  }
  return h`<div class="fld"><label for="f_${key}">${label}</label>
    <input id="f_${key}" data-k="${key}" type="${type||"text"}"
           ${type==="email"||type==="tel"?'dir="ltr" style="text-align:end"':""} value="${esc(v)}">
    ${hint?'<span class="hint">'+hint+'</span>':""}</div>`;
}

/* ── سرنخ‌ها ── */
var LEAD_FA={new:"تازه",contacted:"تماس گرفته شد",won:"مشتری شد",lost:"از دست رفت"};
var LEAD_CLS={new:"warn",contacted:"info",won:"ok",lost:"mute"};

/* ══════════ اعلان پلتفرم ══════════
 *
 * سوپرادمین به بخشی از کاربران همهٔ آموزشگاه‌ها می‌فرستد. بخش‌بندی
 * مهم است، نه تزئینی: پیامی که به همه می‌رود برای بیشترشان بی‌ربط
 * است و دفعهٔ بعد کسی نمی‌خواندش. «آموزشگاه‌هایی که دورهٔ آزمایشی‌شان
 * رو به پایان است» مخاطب واقعی یک پیام است؛ «همه» معمولاً نیست.
 */

var NKIND={info:{i:"◆",c:"nk-info",t:"خبر"},
           success:{i:"✓",c:"nk-ok",t:"خبر خوب"},
           warn:{i:"!",c:"nk-warn",t:"هشدار"},
           urgent:{i:"!!",c:"nk-bad",t:"فوری"}};

function loadNotify(force){
  if(S.notifBusy)return;
  if(S.notifData&&!force)return;
  S.notifBusy=true;
  Promise.all([
    call({action:"notify.audiences"}),
    call({action:"notify.sent"})
  ]).then(function(r){
    S.notifBusy=false;
    if(r[0]&&r[0].ok)S.notifData=r[0];
    if(r[1]&&r[1].ok)S.notifSent=r[1].sent||[];
    if(S.view==="notify")render();
  });
}

function nfRead(){
  var t=el("nfTitle"), b=el("nfBody"), i=el("nfInst");
  if(t)S.notifDraft.title=t.value;
  if(b)S.notifDraft.body=b.value;
  /* کشویی آموزشگاه و کارت‌های بخش یک خانه‌اند: انتخاب هرکدام آن یکی
     را باطل می‌کند، وگرنه کاربر دو چیز انتخاب‌شده می‌بیند و نمی‌داند
     کدام می‌رود */
  if(i&&i.value&&i.value!==S.notifDraft.segment&&i.value.indexOf("inst:")===0){
    S.notifDraft.segment=i.value;
  }
}

function viewNotify(){
  loadNotify(false);
  var d=S.notifData;
  if(!d)return '<div class="card"><div class="empty">در حال بارگذاری…</div></div>';

  var n=S.notifDraft;
  var picked=(d.segments||[]).concat((d.institutes||[]).map(function(i){
    return {key:"inst:"+i.id,label:"آموزشگاه "+i.name,count:i.count};
  })).filter(function(x){return x.key===n.segment;})[0];

  return h`
  <div class="card" style="margin-block-end:16px">
    <div class="card-h"><h3>اعلان تازه</h3></div>
    <div style="padding:16px">

      <div class="fld">
        <label>بخش مخاطب <span class="rq">*</span></label>
        <div class="seg-picks">${(d.segments||[]).map(function(s){
          return h`<button class="aud ${n.segment===s.key?"on":""}"
                           data-seg="${esc(s.key)}" ${s.count?"":"disabled"}>
            <b>${esc(s.label)}</b>
            <small class="num">${s.count?fa(s.count)+" نفر":"کسی نیست"}</small></button>`;
        }).join("")}</div>
      </div>

      <div class="fld">
        <label for="nfInst">یا یک آموزشگاه مشخص</label>
        <select id="nfInst">
          <option value="">— انتخاب کنید —</option>
          ${(d.institutes||[]).map(function(i){
            return '<option value="inst:'+esc(i.id)+'"'+(n.segment==="inst:"+i.id?" selected":"")+'>'
                 + esc(i.name)+' ('+fa(i.count)+' نفر)'+(i.plan==="trial"?" — آزمایشی":"")
                 + (i.status==="suspended"?" — معلق":"")+'</option>';}).join("")}
        </select>
      </div>

      <div class="fld">
        <label for="nfTitle">عنوان <span class="rq">*</span></label>
        <input id="nfTitle" type="text" maxlength="140" value="${esc(n.title)}"
               placeholder="مثلاً: به‌روزرسانی سامانه در شب جمعه">
      </div>
      <div class="fld">
        <label for="nfBody">متن <span class="rq">*</span></label>
        <textarea id="nfBody" maxlength="2000" rows="4"
                  placeholder="کوتاه و روشن. گیرنده روی گوشی سه خط اول را می‌بیند.">${esc(n.body)}</textarea>
      </div>

      <div class="fld">

        <div class="kind-picks">${[["info","عادی"],["success","خوب"],["warn","هشدار"],["urgent","فوری"]]
          .map(function(k){
            return '<button class="kind '+(n.kind===k[0]?"on ":"")+"nk-"+k[0]+'" data-kind="'+k[0]+'">'

      </div>

      </div>
    </div>
  </div>

    <div class="card-h"><h3>فرستاده‌های پلتفرم</h3>
      <button class="btn btn--g btn--sm" data-a="nf-refresh">تازه‌سازی</button></div>

/* ══════════ وبلاگ ══════════
 *
 * ویرایشگر روی contenteditable ساخته شده، نه روی یک کتابخانهٔ آماده.
 * دلیلش همان دلیل همیشگی این پروژه است: هاست اشتراکی، بی npm و بی
 * مرحلهٔ build. execCommand منسوخ اعلام شده ولی در همهٔ مرورگرهای
 * امروز کار می‌کند و جایگزینِ بی‌وابستگی ندارد.

 * هرچه اینجا تولید شود، سمت سرور پالوده می‌شود — پس ویرایشگر لازم
 * نیست خودش امن باشد، فقط باید راحت باشد.
 */

function loadBlog(force){

  call({action:"blog.list"}).then(function(r){
    S.blogBusy=false;
    if(r.ok)S.blog=r;
    if(S.view==="blog")render();
  });
}

function blogUploadUrl(file){
  var base=(S.blog&&S.blog.uploads&&S.blog.uploads.url)||"https://talkora.ir/blog/uploads";
  return base+"/"+encodeURIComponent(file);
}

/*
 * بدنه بعد از هر render دوباره پر می‌شود.
 *
 * contenteditable را نمی‌شود مثل input با value پر کرد؛ innerHTML
 * لازم است و باید *بعد* از نشستن عنصر در DOM انجام شود. اگر داخل
 * قالب می‌گذاشتیمش، هر بار که کاربر چیزی تایپ می‌کرد و render
 * می‌خورد، مکان‌نما به اول متن می‌پرید.
 */
function blogFillBody(){
  var n=el("bBody");
  if(n&&S.blogEdit)n.innerHTML=S.blogEdit.body||"";
}

/** نوشته‌های فرم را پیش از هر render برمی‌دارد */
function blogRead(){
  if(!S.blogEdit)return;
  var p=S.blogEdit;
  function v(id){var n=el(id); return n?n.value:"";}
  p.title=v("bTitle"); p.slug=v("bSlug"); p.excerpt=v("bExcerpt");
  p.categoryId=v("bCat"); p.coverAlt=v("bCoverAlt");
  p.metaTitle=v("bMetaT"); p.metaDesc=v("bMetaD"); p.author=v("bAuthor");
  var bd=el("bBody"); if(bd)p.body=bd.innerHTML;
}

/**
 * آپلود تصویر.
 *
 * فایل با FileReader به data-URI تبدیل می‌شود و همان رشته می‌رود —
 * یک مسیر به‌جای دو، و بی‌نیاز از فرم چندبخشی که با بدنهٔ JSON بقیهٔ
 * API نمی‌خواند. سرور خودش از بایت‌ها بررسی می‌کند که واقعاً تصویر
 * است؛ پسوند و MIME هر دو از سمت مرورگر می‌آیند و هر دو دروغ
 * می‌گویند.
 */
function blogUpload(file, then){
  if(!file)return;
  if(file.size>3*1024*1024){toast("حجم تصویر بیشتر از ۳ مگابایت است");return;}
  var fr=new FileReader();
  fr.onload=function(){
    toast("در حال آپلود…");
    call({action:"blog.upload",name:file.name,data:String(fr.result)}).then(function(r){
      if(!r.ok){toast(r.message||"آپلود نشد");return;}
      then(r);
    });
  };
  fr.onerror=function(){toast("فایل خوانده نشد");};
  fr.readAsDataURL(file);
}

function viewAccess(){
  var d=S.access;
  if(!d)return '<div class="card"><div class="empty">در حال بارگذاری…</div></div>';

  var groups={},order=[];
  d.permissions.forEach(function(p){
    if(!groups[p.group]){groups[p.group]=[];order.push(p.group);}
    groups[p.group].push(p);
  });
  var roles=d.roles;
  var sel=S.accessRole||roles[0].id;
  var role=roles.filter(function(r){return r.id===sel;})[0]||roles[0];
  var locked=role.system&&role.key==="manager";

  return h`
  <div class="card" style="margin-block-end:16px">
    <div class="card-h"><h3>نقش‌ها</h3>
      <button class="btn btn--p btn--sm" data-a="roleNew">نقش تازه</button></div>

        ${roles.map(function(r){
          return '<button class="btn btn--'+(r.id===sel?"p":"g")+' btn--sm" data-a="roleSel" data-id="'+r.id+'">'+
                 esc(r.name)+'<span class="muted" style="margin-inline-start:6px">'+fa(r.users)+'</span></button>';
        }).join("")}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h">
      <h3>${esc(role.name)}${role.system?' <span class="pill p-info">سیستمی</span>':""}</h3>
      <div style="display:flex;gap:8px">
        ${locked?"":'<button class="btn btn--p btn--sm" data-a="roleSave" data-id="'+role.id+'">ذخیرهٔ بسته</button>'}
        ${role.system?"":'<button class="btn btn--g btn--sm" data-a="roleDel" data-id="'+role.id+'">حذف نقش</button>'}
      </div>
    </div>
    <div class="card-b">
      ${role.desc?'<p class="muted" style="margin-block-end:12px">'+esc(role.desc)+'</p>':""}
      ${locked?'<div class="note note--i">بستهٔ مدیر آموزشگاه ثابت است — او همه‌کارهٔ آموزشگاه خودش است و هر مجوز تازه‌ای خودبه‌خود به او می‌رسد.</div>':""}
      <div class="tbl-wrap"><table id="permMatrix"><tbody>
      ${order.map(function(g){
        return '<tr class="grp"><td colspan="3"><b>'+esc(g)+'</b></td></tr>'+
        groups[g].map(function(p){
          var has=Object.prototype.hasOwnProperty.call(role.perms,p.key);
          var sc=role.perms[p.key]||role.scope;
          if(p.platform){
            return '<tr><td style="opacity:.55">'+esc(p.label)+'</td>'+
                   '<td colspan="2"><span class="pill p-mute">فقط مالک پلتفرم</span></td></tr>';
          }
          return '<tr><td>'+esc(p.label)+
                 (p.write?' <span class="pill p-warn" style="font-size:10px">نوشتنی</span>':"")+'</td>'+
                 '<td style="width:60px"><input type="checkbox" data-perm="'+p.key+'"'+(has?" checked":"")+
                 (locked?" disabled":"")+'></td>'+
                 '<td style="width:170px"><select data-scope="'+p.key+'"'+(locked?" disabled":"")+
                 ' style="padding:4px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px">'+
                 (d.scopes||[]).map(function(x){
                   return '<option value="'+x+'"'+(sc===x?" selected":"")+'>'+(SCOPE_FA[x]||x)+'</option>';}).join("")+
                 '</select></td></tr>';
        }).join("");
      }).join("")}
      </tbody></table></div>
    </div>
  </div>`;
}

     contenteditable با value پر نمی‌شود و innerHTML باید بعد از

function need(view){
  if(!API.live){
    if(view==="dash"&&!S.stats)S.stats=demoStats();
    if(view==="institutes"&&!S.institutes&&!S.instDetail)S.institutes=demoInstitutes();
    if(view==="leads"&&!S.leads)S.leads=demoLeads();
    if(view==="events"&&!S.events)S.events=demoEvents();
    if(view==="health"&&!S.health)S.health=demoHealth();
    if(!S.settings&&["pricing","contact","content","trust","sms"].indexOf(view)>=0)S.settings=demoSettings();
    return Promise.resolve();
  }
  if(view==="dash"&&!S.stats){
    /*
     * جاروی قراردادهای تمام‌شده، همراه آمار پیشخوان.
     *
     * کرون‌جاب نداریم و روی هاست اشتراکی هم نمی‌شود داشت. هر بار که
     * سوپرادمین پیشخوان را باز می‌کند، قراردادهای گذشته بسته می‌شوند
     * و آن‌هایی که تا دو هفتهٔ دیگر تمام می‌شوند هشدار می‌گیرند. همان
     * الگوی demo.sweep که از قبل کار می‌کرد.
     */
    return Promise.all([
      call({action:"stats"}).then(function(r){if(r.ok)S.stats=r.stats;}),
      call({action:"institutes.sweepExpired"}).then(function(r){
        if(!r.ok)return;
        S.endingSoon=r.endingSoon||[];
        if(r.suspended>0)toast(fa(r.suspended)+" آموزشگاه به‌خاطر پایان قرارداد تعلیق شد");
      })
    ]);
  }
  if(view==="institutes"&&!S.institutes&&!S.instDetail) return doInstSearch();
  if(view==="leads"&&!S.leads)     return call({action:"leads"}).then(function(r){if(r.ok)S.leads=r;});
  if(view==="blog"&&!S.blog)       return call({action:"blog.list"}).then(function(r){if(r.ok)S.blog=r;});
  if(view==="access"&&!S.access)   return call({action:"access.catalogue"}).then(function(r){if(r.ok)S.access=r;});
  if(view==="events"&&!S.events)   return call({action:"recent"}).then(function(r){if(r.ok)S.events=r.events;});
  if(view==="health"&&!S.health)   return call({action:"diagnostics"}).then(function(r){if(r.ok)S.health=r.checks;});
  if(view==="sms"){
    var jobs=[call({action:"loginCodes"}).then(function(r){if(r.ok)S.codes=r.codes;})];
    if(!S.settings)jobs.push(call({action:"settings"}).then(function(r){if(r.ok)S.settings=r.settings;}));
    return Promise.all(jobs);
  }
  if(!S.settings&&["pricing","contact","content","trust"].indexOf(view)>=0){
    return call({action:"settings"}).then(function(r){if(r.ok)S.settings=r.settings;});
  }
  return Promise.resolve();
}

function doInstSearch(){
  if(!API.live){S.institutes=demoInstitutes().filter(function(i){
    return !S.instQ||i.name.indexOf(S.instQ)>=0||( i.city||"").indexOf(S.instQ)>=0;
  });return Promise.resolve();}
  return call({action:"institutes.list",q:S.instQ,status:S.instStatus}).then(function(r){
    if(r.ok)S.institutes=r.institutes; else toast(r.message||"جست‌وجو ناموفق بود");
  });
}
function doInstOpen(id){
  if(!API.live){S.instDetail=demoInstituteDetail(id);render();return;}
  S.instDetail=null; render();
  call({action:"institutes.get",id:id}).then(function(r){
    if(r.ok)S.instDetail=r; else toast(r.message||"باز نشد");
    render();
  });
}
/*
 * فهرست کاربران — بی‌شرط بار می‌شود، نه فقط وقتی کسی چیزی تایپ کند.
 *
 * نسخهٔ قبلی تا دو حرف وارد نمی‌شد هیچ نشان نمی‌داد، و سوپرادمینی که
 * می‌خواست بداند اصلاً چند نفر ثبت‌نام کرده‌اند باید نام کسی را حدس
 * می‌زد. حالا پالایه‌ها فهرست را باریک می‌کنند، نه اینکه بسازندش.
 */
function doUserLoad(resetPage){
  if(resetPage)S.userFilter.page=1;
  if(!API.live){S.userResults=demoUsers(S.userQ);S.userMeta=null;render();return;}
  S.userBusy=true;
  var f=S.userFilter;
  call({action:"users.list",q:S.userQ,status:f.status,role:f.role,
        instituteId:f.instituteId,page:f.page,limit:f.limit}).then(function(r){
    S.userBusy=false;
    if(r.ok){
      S.userResults=r.users;
      S.userMeta={total:r.total,page:r.page,pages:r.pages,limit:r.limit};
    }else toast(r.message||"فهرست نیامد");
    render();
  });
  // آمار بالای صفحه یک‌بار می‌آید؛ با پالایه عوض نمی‌شود
  if(!S.userStats){
    call({action:"users.stats"}).then(function(r){
      if(r.ok){S.userStats=r.stats;render();}
    });
  }
}
function mb2(s){return (s||"").length;}
function doUserOpen(id){
  if(!API.live){S.userDetail=demoUserDetail(id);render();return;}
  // کاتالوگ مجوزها برای فهرست کشویی لازم است؛ یک‌بار می‌آید و می‌ماند
  if(!S.access)call({action:"access.catalogue"}).then(function(r){if(r.ok){S.access=r;render();}});
  S.userDetail=null; render();
  call({action:"users.get",id:id}).then(function(r){
    if(r.ok)S.userDetail=r; else toast(r.message||"باز نشد");
    render();
  });
}

var codeTimer=null;
function syncCodeTimer(){
  if(S.view==="sms"&&!codeTimer&&API.live){
    codeTimer=setInterval(function(){
      if(S.view!=="sms"||!API.admin||!API.live)return;
      call({action:"loginCodes"}).then(function(r){
        if(!r.ok)return; S.codes=r.codes; if(S.view==="sms")render();
      });
    },5*60*1000);
  }else if((S.view!=="sms"||!API.live)&&codeTimer){
    clearInterval(codeTimer); codeTimer=null;
  }
}

function goView(v){
  S.view=v; S.instDetail=null; S.userDetail=null;
  if(v!=="sms"){S.issued=null;S.smsTest=null;}
  render(); syncCodeTimer();
  need(v).then(function(){render();syncCodeTimer();});
}

/* ══════════ کنش‌ها ══════════ */
function readForm(){
  var out={};
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(f){
    var v=f.value;
    if(f.dataset.money==="1"){
      var t=+enDigits(String(v).replace(/[٬,\s]/g,""))||0;
      v=String(t*10);
    }
    out[f.dataset.k]=v;
  });
  return out;
}

document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){goView(g.dataset.go);return;}

  var oi=e.target.closest("[data-openinst]");
  if(oi){S.instDetail=null;doInstOpen(oi.dataset.openinst);return;}

  var ou=e.target.closest("[data-openuser]");
  if(ou){S.userDetail=null;doUserOpen(ou.dataset.openuser);return;}

  /*
     نوشته‌های فرم را پیش از هر render برمی‌داریم؛ وگرنه زدن روی یک
     بخش یا لحن، عنوان و متنِ تایپ‌شده را پاک می‌کند.
  */
  var seg=e.target.closest("[data-seg]");
  if(seg){ nfRead(); S.notifDraft.segment=seg.dataset.seg; S.notifDraft.err=""; render(); return; }
  var kd=e.target.closest("[data-kind]");
  if(kd){ nfRead(); S.notifDraft.kind=kd.dataset.kind; render(); return; }

  /*
     نوار ابزار ویرایشگر.
     preventDefault لازم است وگرنه کلیک، تمرکز را از contenteditable
     می‌گیرد و execCommand روی انتخابِ ازدست‌رفته اثری ندارد.
  */
  var ed=e.target.closest("[data-ed]");
  if(ed){
    e.preventDefault();
    var body=el("bBody"); if(body)body.focus();
    document.execCommand(ed.dataset.ed,false,ed.dataset.v?"<"+ed.dataset.v+">":null);
    blogRead();
    return;
  }

  var b=e.target.closest("[data-a]");
  if(!b)return;
  var a=b.dataset.a;


  /* ── وبلاگ ── */
  if(a==="blogNew"){
    S.blogEdit={id:"",title:"",slug:"",excerpt:"",body:"",cover:null,coverAlt:"",
                categoryId:"",metaTitle:"",metaDesc:"",author:"تیم تاکورا",
                status:"draft",busy:false,err:""};
    render(); return;
  }
  if(a==="blogBack"){ S.blogEdit=null; loadBlog(true); render(); return; }
  if(a==="blogEdit"){
    call({action:"blog.get",id:b.dataset.id}).then(function(r){
      if(!r.ok){toast(r.message||"باز نشد");return;}
      S.blogEdit=Object.assign({busy:false,err:""},r.post);
      render();
    });
    return;
  }
  if(a==="blogCoverClear"){ blogRead(); S.blogEdit.cover=null; render(); return; }

  if(a==="blogSave"){
    if(S.blogEdit&&S.blogEdit.busy)return;
    blogRead();
    var p=S.blogEdit;
    if(!p.title.trim()){ p.err="عنوان را بنویسید."; render(); return; }
    if(!p.body.trim()){ p.err="متن نوشته خالی است."; render(); return; }
    p.busy=true; p.err=""; render();
    call({action:"blog.save",id:p.id||"",title:p.title,slug:p.slug,excerpt:p.excerpt,
          body:p.body,cover:p.cover||"",coverAlt:p.coverAlt,categoryId:p.categoryId,
          metaTitle:p.metaTitle,metaDesc:p.metaDesc,author:p.author}).then(function(r){
      S.blogEdit.busy=false;
      if(!r.ok){ S.blogEdit.err=r.message||"ذخیره نشد"; render(); return; }
      S.blogEdit.id=r.id; S.blogEdit.slug=r.slug;
      toast("ذخیره شد — "+fa(r.readingMin)+" دقیقه خواندن");
      loadBlog(true); render();
    });
    return;
  }

  if(a==="blogPub"){
    var pid=b.dataset.id, on=b.dataset.on==="1";
    /*
     * اگر روی صفحهٔ ویرایش هستیم، اول ذخیره بعد انتشار.
     *
     * وگرنه دکمهٔ «ذخیره و انتشار» نسخهٔ قبلی را منتشر می‌کرد و
     * نویسنده فکر می‌کرد تغییرهایش رفته — بدترین نوع اشتباه، چون
     * بی‌صداست.
     */
    var go=function(){
      call({action:"blog.publish",id:pid,on:on}).then(function(r){
        if(!r.ok){toast(r.message||"انجام نشد");return;}
        toast(on?"منتشر شد":"از انتشار درآمد");
        if(S.blogEdit&&S.blogEdit.id===pid)S.blogEdit.status=r.status;
        loadBlog(true); render();
      });
    };
    if(S.blogEdit&&S.blogEdit.id===pid){
      blogRead();
      var q=S.blogEdit;
      call({action:"blog.save",id:q.id,title:q.title,slug:q.slug,excerpt:q.excerpt,
            body:q.body,cover:q.cover||"",coverAlt:q.coverAlt,categoryId:q.categoryId,
            metaTitle:q.metaTitle,metaDesc:q.metaDesc,author:q.author}).then(function(r){
        if(!r.ok){toast(r.message||"ذخیره نشد");return;}
        S.blogEdit.slug=r.slug; go();
      });
    } else go();
    return;
  }

  if(a==="blogDelete"){
    if(!confirm("این نوشته و تصویر شاخصش برای همیشه پاک می‌شوند. مطمئنید؟"))return;
    call({action:"blog.delete",id:b.dataset.id}).then(function(r){
      if(!r.ok){toast(r.message||"حذف نشد");return;}
      toast("نوشته حذف شد");
      S.blogEdit=null; loadBlog(true); render();
    });
    return;
  }

  if(a==="blogLink"){
    var url=prompt("نشانی پیوند:","https://");
    if(!url)return;
    document.execCommand("createLink",false,url);
    blogRead(); return;
  }
  if(a==="blogImage"){ var fi=el("bInlineFile"); if(fi)fi.click(); return; }

  /* ── اعلان پلتفرم ── */
  if(a==="nf-refresh"){ loadNotify(true); toast("تازه‌سازی شد"); return; }
  if(a==="nf-send"){
    if(S.notifDraft.busy)return;
    nfRead();
    var n=S.notifDraft;
    if(!n.segment){ n.err="بخش مخاطب را انتخاب کنید."; render(); return; }
    if(!n.title.trim()){ n.err="عنوان را بنویسید."; render(); return; }
    if(!n.body.trim()){ n.err="متن اعلان را بنویسید."; render(); return; }
    n.busy=true; n.err=""; render();
    call({action:"notify.send",segment:n.segment,title:n.title.trim(),
          body:n.body.trim(),kind:n.kind}).then(function(r){
      S.notifDraft.busy=false;
      if(!r.ok){ S.notifDraft.err=r.message||"فرستاده نشد."; render(); return; }
      S.notifDraft.title=""; S.notifDraft.body="";
      toast("به "+fa(r.recipients)+" نفر فرستاده شد — "+r.audience);
      loadNotify(true);
    });
    return;
  }

  /* ── اعطا و سلب موردی ── */
  if(a==="permAllow"||a==="permDeny"){
    var days=parseInt(String((el("apDays")||{}).value||"0").replace(/[۰-۹]/g,function(c){
      return "۰۱۲۳۴۵۶۷۸۹".indexOf(c);}),10)||0;
    call({action:"user.permSet",userId:b.dataset.uid,
          instituteId:(el("apInst")||{}).value,perm:(el("apPerm")||{}).value,
          effect:a==="permAllow"?"allow":"deny",
          scope:(el("apScope")||{}).value,days:days})
      .then(function(r){
        if(!r.ok){toast(r.message||"انجام نشد");return;}
        toast(a==="permAllow"?"دسترسی داده شد":"دسترسی گرفته شد");
        doUserOpen(b.dataset.uid);
      });
    return;
  }

  if(a==="permClear"){
    call({action:"user.permSet",userId:b.dataset.uid,instituteId:b.dataset.iid,
          perm:b.dataset.perm,effect:"clear"}).then(function(r){
      if(!r.ok){toast(r.message||"برداشته نشد");return;}
      toast("استثنا برداشته شد");
      doUserOpen(b.dataset.uid);
    });
    return;
  }

  /* ── نقش‌ها و مجوزها ── */
  if(a==="roleSel"){S.accessRole=b.dataset.id;render();return;}

  if(a==="roleNew"){
    var nm=prompt("نام نقش تازه (مثلاً: مسئول مالی)");
    if(!nm||!nm.trim())return;
    var ky=prompt("کلید انگلیسی نقش (مثلاً: financial_manager)");
    if(!ky||!ky.trim())return;
    call({action:"roles.create",name:nm.trim(),key:ky.trim(),scope:"institute"})
      .then(function(r){
        if(!r.ok){toast(r.message||"ساخته نشد");return;}
        S.access=null;S.accessRole=r.id;
        need("access").then(render);
      });
    return;
  }

  if(a==="roleDel"){
    if(!confirm("این نقش حذف شود؟ اگر به کسی داده شده باشد، حذف نمی‌شود."))return;
    call({action:"roles.delete",id:b.dataset.id}).then(function(r){
      if(!r.ok){toast(r.message||"حذف نشد");return;}
      S.access=null;S.accessRole=null;need("access").then(render);
    });
    return;
  }

  /*
   * بستهٔ مجوز یک‌جا فرستاده می‌شود، نه تیک‌به‌تیک. اگر هر تیک یک
   * درخواست بود، نیمه‌کاره‌ماندن وسط کار یعنی نقشی با دسترسی‌ای که
   * مالک هرگز قصدش را نداشته.
   */
  if(a==="roleSave"){
    var perms={};
    document.querySelectorAll("#permMatrix input[data-perm]").forEach(function(cb){
      if(!cb.checked)return;
      var k=cb.dataset.perm;
      var sc=document.querySelector('#permMatrix select[data-scope="'+k+'"]');
      perms[k]=sc?sc.value:"own";
    });
    call({action:"roles.setPerms",id:b.dataset.id,perms:perms}).then(function(r){
      if(!r.ok){toast(r.message||"ذخیره نشد");return;}
      toast("بستهٔ نقش ذخیره شد — "+fa(r.count)+" مجوز");
      S.access=null;need("access").then(render);
    });
    return;
  }

  /* ── تأیید درخواست دمو ── */
  if(a==="demoApprove"){
    var dv=prompt("دورهٔ آزمایشی چند روز باشد؟","14");
    if(dv===null)return;
    var dn=parseInt(String(dv).replace(/[۰-۹]/g,function(c){return "۰۱۲۳۴۵۶۷۸۹".indexOf(c);}),10);
    if(!dn||dn<1){toast("عدد معتبر وارد کنید");return;}
    call({action:"demo.approve",id:b.dataset.id,days:dn}).then(function(r){
      if(!r.ok){toast(r.message||"انجام نشد");return;}
      toast("آموزشگاه دمو ساخته شد — "+fa(dn)+" روز");
      S.leads=null;need("leads").then(render);
    });
    return;
  }

  if(a==="theme"){
    var root=document.documentElement, cur=root.getAttribute("data-theme");
    if(!cur)cur=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    root.setAttribute("data-theme",cur==="dark"?"light":"dark");
    return;
  }

  if(a==="login"||a==="setup"){
    if(S.busy)return;
    var u=(el("lgUser")||{}).value||"", p=(el("lgPass")||{}).value||"";
    if(!u.trim()||!p){S.err="نام کاربری و رمز را وارد کنید.";render();return;}
    var body={action:a==="setup"?"bootstrap":"login",username:u.trim(),password:p};
    if(a==="setup"){
      body.setupKey=(el("lgKey")||{}).value||"";
      body.fullName=(el("lgName")||{}).value||"";
      if(!body.setupKey){S.err="کلید راه‌اندازی را وارد کنید.";render();return;}
      if(p.length<10){S.err="رمز باید حداقل ۱۰ نویسه باشد.";render();return;}
    }
    S.busy=true; S.err=""; render();
    call(body).then(function(r){
      S.busy=false;
      if(!r.ok){S.err=r.message||"ورود نشد.";render();return;}
      API.admin=r.admin; API.needsSetup=false; API.live=true; S.err="";
      goView("dash"); toast("خوش آمدید");
    });
    return;
  }

  if(a==="save"){
    if(S.busy)return;
    var payload=readForm();
    if(!API.live){S.settings=Object.assign({},S.settings,payload);render();toast("در نسخهٔ نمایشی ذخیره نمی‌شود.");return;}
    S.busy=true; render();
    call({action:"saveSettings",settings:payload}).then(function(r){
      S.busy=false;
      if(!r.ok){render();toast(r.message||"ذخیره نشد");return;}
      S.settings=r.settings; render(); toast("ذخیره شد");
    });
    return;
  }

  if(a==="codes"){call({action:"loginCodes"}).then(function(r){if(r.ok){S.codes=r.codes;render();}});return;}

  if(a==="health"){
    S.health=null; render();
    if(!API.live){S.health=demoHealth();render();return;}
    call({action:"diagnostics"}).then(function(r){if(r.ok)S.health=r.checks;render();});
    return;
  }

  if(a==="issue"){
    if(S.busy)return;
    var ph=enDigits(((el("icPhone")||{}).value||"")).replace(/\s/g,"");
    if(!/^09\d{9}$/.test(ph)){toast("شماره باید ۱۱ رقم و با ۰۹ شروع شود");return;}
    if(!API.live){S.issued={code:"12345",phone:ph};render();toast("نمونه — پیامکی نرفته");return;}
    S.busy=true;
    call({action:"issueCode",phone:ph}).then(function(r){
      S.busy=false;
      if(!r.ok){render();toast(r.message||"ساخته نشد");return;}
      S.issued=r.code?{code:r.code,phone:r.phone}:null;
      S.codes=null; need("sms").then(render);
      toast(r.code?"کد ساخته شد":"کد پیامک شد");
    });
    return;
  }

  if(a==="smstest"){
    if(S.busy)return;
    var sp=enDigits(((el("stPhone")||{}).value||"")).replace(/\s/g,"");
    if(!/^09\d{9}$/.test(sp)){toast("شماره باید ۱۱ رقم و با ۰۹ شروع شود");return;}
    if(!API.live){toast("در نسخهٔ نمایشی پیامکی نمی‌رود.");return;}
    S.busy=true; toast("در حال ارسال…");
    call({action:"smsTest",phone:sp}).then(function(r){
      S.busy=false;
      S.smsTest={ok:!!r.ok,code:r.code,param:r.param,template:r.template,message:r.message||""};
      render(); toast(r.ok?"فرستاده شد":"فرستاده نشد");
    });
    return;
  }

  if(a==="testmail"){
    if(!API.live){toast("در نسخهٔ نمایشی ایمیلی نمی‌رود.");return;}
    toast("در حال ارسال…");
    call({action:"testMail"}).then(function(r){toast(r.ok?"ایمیل آزمایشی فرستاده شد":(r.message||"ارسال نشد"));});
    return;
  }

  if(a==="passwd"){
    if(S.busy)return;
    var o=(el("pwOld")||{}).value||"", n=(el("pwNew")||{}).value||"", n2=(el("pwNew2")||{}).value||"";
    if(n.length<10){toast("رمز تازه باید حداقل ۱۰ نویسه باشد");return;}
    if(n!==n2){toast("تکرار رمز با خودش نمی‌خواند");return;}
    if(!API.live){toast("در نسخهٔ نمایشی تغییری اعمال نمی‌شود.");return;}
    S.busy=true;
    call({action:"password",current:o,new:n}).then(function(r){
      S.busy=false; render(); toast(r.ok?"رمز عوض شد":(r.message||"عوض نشد"));
    });
    return;
  }

  if(a==="logout"){
    if(!API.live){API.admin=null;render();return;}
    call({action:"logout"}).then(function(){
      API.admin=null; S.settings=S.leads=S.stats=S.events=null; S.codes=S.health=S.issued=S.smsTest=null;
      if(codeTimer){clearInterval(codeTimer);codeTimer=null;}
      render(); toast("خارج شدید");
    });
    return;
  }

  if(a==="instSearch"){
    S.instQ=(el("instQ")||{}).value||""; S.instStatus=(el("instStatus")||{}).value||"";
    S.institutes=null; render(); doInstSearch().then(render);
    return;
  }
  if(a==="instBack"){S.instDetail=null;render();return;}
  if(a==="instCreate"){
    if(S.busy)return;
    var body={
      name:(el("niName")||{}).value||"", city:(el("niCity")||{}).value||"",
      ownerName:(el("niOwnerName")||{}).value||"",
      ownerPhone:enDigits(((el("niOwnerPhone")||{}).value||"")).replace(/\s/g,""),
    };
    if(!body.name.trim()){toast("نام آموزشگاه را وارد کنید");return;}
    if(!body.ownerName.trim()){toast("نام مدیر را وارد کنید");return;}
    if(!/^09\d{9}$/.test(body.ownerPhone)){toast("شمارهٔ مدیر باید ۱۱ رقم و با ۰۹ شروع شود");return;}
    if(!API.live){toast("در نسخهٔ نمایشی ساخته نمی‌شود.");return;}
    S.busy=true; render();
    call(Object.assign({action:"institutes.create"},body)).then(function(r){
      S.busy=false;
      if(!r.ok){render();toast(r.message||"ساخته نشد");return;}
      toast("آموزشگاه ساخته شد"); S.institutes=null; render(); doInstSearch().then(render);
    });
    return;
  }
  if(a==="instSuspend"||a==="instReactivate"){
    var iid=b.dataset.id;
    if(a==="instSuspend"){
      var reason=prompt("دلیل تعلیق را بنویسید:");
      if(!reason||!reason.trim())return;
      if(!API.live){toast("در نسخهٔ نمایشی اعمال نمی‌شود.");return;}
      call({action:"institutes.suspend",id:iid,reason:reason.trim()}).then(function(r){
        if(!r.ok){toast(r.message||"انجام نشد");return;}
        toast("آموزشگاه معلق شد"); doInstOpen(iid);
      });
    }else{
      if(!API.live){toast("در نسخهٔ نمایشی اعمال نمی‌شود.");return;}
      call({action:"institutes.reactivate",id:iid}).then(function(r){
        if(!r.ok){toast(r.message||"انجام نشد");return;}
        toast("رفع تعلیق شد"); doInstOpen(iid);
      });
    }
    return;
  }
  if(a==="instWindow"){
    var wid=b.dataset.id;
    var from=jSelVal("wFrom"), to=jSelVal("wTo");
    call({action:"institutes.setWindow",id:wid,from:from,to:to}).then(function(r){
      if(!r.ok){toast(r.message||"ذخیره نشد");return;}
      toast(r.to
        ? (r.daysLeft>=0 ? "بازه ذخیره شد — "+fa(r.daysLeft)+" روز مانده"
                         : "بازه ذخیره شد — قرارداد گذشته است")
        : "بازه بدون تاریخ پایان ذخیره شد");
      doInstOpen(wid);
    });
    return;
  }
  if(a==="instJitsiToggle"){
    var jiid=b.dataset.id, jon=b.dataset.on==="1";
    if(!API.live){toast("در نسخهٔ نمایشی اعمال نمی‌شود.");return;}
    call({action:"institutes.setJitsiEnabled",id:jiid,on:jon}).then(function(r){
      if(!r.ok){toast(r.message||"انجام نشد");return;}
      toast(jon?"جلسهٔ میت برای این آموزشگاه فعال شد":"جلسهٔ میت برای این آموزشگاه غیرفعال شد");
      doInstOpen(jiid);
    });
    return;
  }

  if(a==="userFilter"){
    S.userQ=(el("userQ")||{}).value||"";
    S.userFilter.role=(el("ufRole")||{}).value||"all";
    S.userFilter.status=(el("ufStatus")||{}).value||"all";
    S.userFilter.instituteId=(el("ufInst")||{}).value||"";
    doUserLoad(true);
    return;
  }
  if(a==="userFilterClear"){
    S.userQ="";
    S.userFilter={status:"all",role:"all",instituteId:"",page:1,limit:S.userFilter.limit};
    doUserLoad(true);
    return;
  }
  if(a==="userPage"){
    var pg=parseInt(b.dataset.p,10);
    if(pg>=1){S.userFilter.page=pg;doUserLoad(false);}
    return;
  }
  if(a==="userBack"){S.userDetail=null;render();return;}
  if(a==="userSuspend"||a==="userReactivate"){
    var uid2=b.dataset.id;
    if(!API.live){toast("در نسخهٔ نمایشی اعمال نمی‌شود.");return;}
    call({action:a==="userSuspend"?"users.suspend":"users.reactivate",id:uid2}).then(function(r){
      if(!r.ok){toast(r.message||"انجام نشد");return;}
      toast("ثبت شد"); doUserOpen(uid2);
    });
    return;
  }
  if(a==="memAdd"){
    var mp=enDigits(((el("addPhone")||{}).value||"")).replace(/\s/g,"");
    var mrole=(el("addRole")||{}).value||"student";
    var miid=b.dataset.inst;
    if(!/^09\d{9}$/.test(mp)){toast("شماره باید ۱۱ رقم و با ۰۹ شروع شود");return;}
    if(!API.live){toast("در نسخهٔ نمایشی اعمال نمی‌شود.");return;}
    call({action:"users.search",q:mp}).then(function(r){
      var u=r.ok&&r.users&&r.users[0];
      if(!u){toast("کاربری با این شماره پیدا نشد");return;}
      call({action:"membership.add",userId:u.id,instituteId:miid,role:mrole}).then(function(r2){
        if(!r2.ok){toast(r2.message||"افزوده نشد");return;}
        toast("افزوده شد"); doInstOpen(miid);
      });
    });
    return;
  }
  if(a==="memSuspend"||a==="memReactivate"){
    var mid=b.dataset.id;
    if(!API.live){toast("در نسخهٔ نمایشی اعمال نمی‌شود.");return;}
    call({action:a==="memSuspend"?"membership.suspend":"membership.reactivate",membershipId:mid}).then(function(r){
      if(!r.ok){toast(r.message||"انجام نشد");return;}
      toast("ثبت شد");
      if(S.instDetail)doInstOpen(S.instDetail.institute.id);
      else if(S.userDetail)doUserOpen(S.userDetail.user.id);
    });
    return;
  }
  if(a==="memMeetingToggle"){
    var mmid=b.dataset.id, mmon=b.dataset.on==="1";
    if(!API.live){toast("در نسخهٔ نمایشی اعمال نمی‌شود.");return;}
    call({action:"membership.setMeetingAccess",membershipId:mmid,on:mmon}).then(function(r){
      if(!r.ok){toast(r.message||"انجام نشد");return;}
      toast("ثبت شد");
      if(S.instDetail)doInstOpen(S.instDetail.institute.id);
      else if(S.userDetail)doUserOpen(S.userDetail.user.id);
    });
    return;
  }
  if(a==="memRemove"){
    var midR=b.dataset.id;
    if(!confirm("این عضویت کاملاً از این آموزشگاه حذف می‌شود (نه موقت، بر خلاف تعلیق). ادامه می‌دهید؟"))return;
    if(!API.live){toast("در نسخهٔ نمایشی اعمال نمی‌شود.");return;}
    call({action:"membership.remove",membershipId:midR}).then(function(r){
      if(!r.ok){toast(r.message||"انجام نشد");return;}
      toast("عضویت حذف شد");
      if(S.instDetail)doInstOpen(S.instDetail.institute.id);
      else if(S.userDetail)doUserOpen(S.userDetail.user.id);
    });
    return;
  }

  if(a==="impStart"){
    S.reasonModal={userId:b.dataset.user,instituteId:b.dataset.inst,name:b.dataset.name};
    render();
    return;
  }
  if(a==="modalClose"){S.reasonModal=null;render();return;}
  if(a==="impConfirm"){
    if(S.busy)return;
    var reasonTxt=(el("impReason")||{}).value||"";
    if(reasonTxt.trim().length<5){toast("دلیل را کامل‌تر بنویسید");return;}
    if(!API.live){toast("در نسخهٔ نمایشی لینکی ساخته نمی‌شود.");S.reasonModal=null;render();return;}
    S.busy=true; render();
    call({action:"impersonate.start",userId:S.reasonModal.userId,instituteId:S.reasonModal.instituteId,reason:reasonTxt.trim()})
      .then(function(r){
        S.busy=false; S.reasonModal=null; render();
        if(!r.ok){toast(r.message||"ساخته نشد");return;}
        window.open(r.url,"_blank","noopener");
        toast("لینک باز شد — ۶۰ ثانیه اعتبار دارد");
      });
    return;
  }
});

document.addEventListener("change",function(e){
  if(e.target.id==="bCoverFile"){
    blogUpload(e.target.files&&e.target.files[0],function(r){
      blogRead(); S.blogEdit.cover=r.file; render();
      toast("تصویر شاخص گذاشته شد");
    });
    return;
  }
  if(e.target.id==="bInlineFile"){
    blogUpload(e.target.files&&e.target.files[0],function(r){
      var body=el("bBody"); if(body)body.focus();
      document.execCommand("insertHTML",false,
        '<img src="'+r.url+'" alt="" width="'+r.width+'" height="'+r.height+'">');
      blogRead();
      toast("تصویر در متن گذاشته شد");
    });
    return;
  }
  var l=e.target.closest&&e.target.closest("[data-lead]");
  if(l){
    if(!API.live){toast("در نسخهٔ نمایشی ذخیره نمی‌شود.");return;}
    call({action:"leadUpdate",id:l.dataset.lead,status:l.value}).then(function(r){
      if(!r.ok){toast(r.message||"ثبت نشد");return;}
      S.leads=null; need("leads").then(render); toast("وضعیت ثبت شد");
    });
    return;
  }
  var sr=e.target.closest&&e.target.closest("[data-setrole]");
  if(sr){
    if(!API.live){toast("در نسخهٔ نمایشی ذخیره نمی‌شود.");return;}
    call({action:"membership.setRole",membershipId:sr.dataset.setrole,role:sr.value}).then(function(r){
      if(!r.ok){toast(r.message||"تغییر نکرد");return;}
      toast("نقش تغییر کرد");
      if(S.instDetail)doInstOpen(S.instDetail.institute.id);
      else if(S.userDetail)doUserOpen(S.userDetail.user.id);
    });
    return;
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!API.admin&&e.target.tagName==="INPUT"){
    var btn=document.querySelector("[data-a='login'],[data-a='setup']");
    if(btn)btn.click();
  }
  if(e.key==="Enter"&&e.target.id==="instQ"){document.querySelector("[data-a='instSearch']").click();}
  if(e.key==="Enter"&&e.target.id==="userQ"){
    var ub=document.querySelector("[data-a='userFilter']"); if(ub)ub.click();}
});

/* ══════════ بالا آمدن ══════════ */
function removeBoot(){var b=el("boot"); if(b)b.remove();}

function startDemo(){
  removeBoot();
  API.live=false; API.admin={username:"demo",name:"نسخهٔ نمایشی"};
  goView("dash");
}

if(!window.fetch||!window.Promise){startDemo();}
else{
  withTimeout(call({action:"me"}),4000).then(function(r){
    removeBoot();
    if(r&&r.ok&&r.authenticated){API.admin=r.admin; API.live=true; goView("dash");}
    else if(r&&r.ok&&!r.authenticated){API.live=true; API.needsSetup=!!r.needsSetup; render();}
    else{startDemo();}
  });
}
})();
</script>
</body>
</html>
