/* ══════════ ثبت‌نام ══════════
 *
 * صفحهٔ جدا از ورود، نه یک «حالت» روی همان فرم.
 *
 * تا اینجا ثبت‌نام یک شاخه از صفحهٔ ورود بود و فقط یک کار می‌کرد:
 * آموزشگاه تازه بساز. یعنی مدرس و زبان‌آموز — که بیشتر کاربران‌اند —
 * هیچ دری نداشتند. حالا سه راه هست و کاربر در گام اول انتخاب می‌کند.
 *
 * چرا سه گام و نه یک فرم بلند: فرم کامل چهارده خانه دارد. کسی که
 * چهارده خانه را یک‌جا ببیند رهایش می‌کند. گام اول فقط یک انتخاب است،
 * گام دوم هویت، گام سوم حساب — و در هر گام دکمهٔ بازگشت هست، پس
 * اشتباه‌کردن هزینه‌ای ندارد.
 */

var SU_ROLES={student:"زبان‌آموز",teacher:"مدرس",manager:"مدیر"};

/** روزهای هر ماه شمسی؛ اسفند ۳۰ فقط در سال کبیسه */
function jMonthDays(jy,jm){
  if(jm<=6)return 31;
  if(jm<=11)return 30;
  var r=(((jy-979)%33)+33)%33;
  return (r%4===0&&r!==32)?30:29;
}

function suErr(msg){S.su.err=msg;S.su.busy=false;render();}

/*
 * هرچه در DOM تایپ شده را پیش از هر render به S منتقل می‌کند.
 *
 * بدون این، زدنِ «ادامه» یا عوض‌کردن یک انتخاب بقیهٔ فرم را پاک می‌کرد،
 * چون render فرم را از روی S می‌سازد نه از روی DOM. کاربر فکر می‌کرد
 * صفحه خراب است، نه اینکه نوشته‌هایش را از دست داده.
 */
function suRead(){
  var u=S.su;
  [["suFnFa","fnFa"],["suLnFa","lnFa"],["suFnEn","fnEn"],["suLnEn","lnEn"],
   ["suNid","nid"],["suEmail","email"],["suCity","city"],["suInstName","instName"],
   ["suPhone","phone"],["suP1","p1"],["suP2","p2"],["suCode","code"],
   ["suMsg","msg"],["suInstQ","instQ"]].forEach(function(p){
    var n=el(p[0]); if(n)u[p[1]]=n.value;
  });
  ["by","bm","bd","gender","role"].forEach(function(k){
    var n=el("su_"+k); if(n)u[k]=n.value;
  });
}

/* از رویداد change صدا زده می‌شود، نه کلیک */
function suDateChanged(){
  /*
   * عوض‌شدن ماه یا سال، فهرست روزها را عوض می‌کند: شهریور ۳۱ روز
   * دارد و مهر ۳۰، و اسفند بسته به کبیسه‌بودن سال ۲۹ یا ۳۰. اگر
   * روزِ انتخاب‌شده در ماه تازه جا نشود، پاکش می‌کنیم — وگرنه
   * «۳۱ مهر» ساخته می‌شد که وجود ندارد.
   */
  suRead();
  var jy=+S.su.by||0, jm=+S.su.bm||1;
  if(jy&&+S.su.bd>jMonthDays(jy,jm))S.su.bd="";
  render();
}

}

/* ══════════ ترم‌ساز ══════════ */
function termConflicts(){
  var rows=S.term.rows||DB.termDraft, out=[];
  rows.forEach(function(r,i){
    if(!r.teacher){out.push({row:r.id,k:"unassigned",t:"کلاس «"+r.course+"» مدرس ندارد"});}
    rows.forEach(function(o,j){
      if(j<=i)return;
      if(r.day===o.day&&r.time===o.time){
        if(r.teacher&&r.teacher===o.teacher){
          var tn=(DB.teachers.filter(function(x){return x.id===r.teacher;})[0]||{}).name;
          out.push({row:r.id,k:"teacher",t:tn+" هم‌زمان در «"+r.course+"» و «"+o.course+"» است"});
        }
        if(r.room===o.room){
          var rn=(DB.rooms.filter(function(x){return x.id===r.room;})[0]||{}).name;
          out.push({row:r.id,k:"room",t:rn+" هم‌زمان به «"+r.course+"» و «"+o.course+"» داده شده"});
        }
      }
    });
    var rm=DB.rooms.filter(function(x){return x.id===r.room;})[0];
    if(rm&&r.cap>rm.cap){out.push({row:r.id,k:"cap",
      t:"ظرفیت «"+r.course+"» ("+fa(r.cap)+") از ظرفیت "+rm.name+" ("+fa(rm.cap)+") بیشتر است"});}
  });
  return out;
}
V["m/term"]=function(){
  var st=S.term, rows=st.rows||(st.rows=JSON.parse(JSON.stringify(DB.termDraft)));
  var cf=termConflicts(), badRows={};
  cf.forEach(function(c){badRows[c.row]=true;});
  var sessions=rows.length*20, revenue=rows.reduce(function(a,r){return a+r.cap*r.price;},0);
  return h`
  <div class="wiz">

  <div style="display:flex;gap:9px;margin-top:16px">

V["m/student"]=function(){
  var s=stu(S.selStudentId)||DB.students[0];
  if(!s){
    return '<div class="card"><div class="empty"><b>زبان‌آموزی انتخاب نشده</b>'
         + '<p>از فهرست «زبان‌آموزان» روی یک نفر کلیک کنید.</p></div></div>';
  }
  /*
   * ثبت‌نام‌ها، سابقهٔ مالی و یادداشت‌های داخلی هنوز هیچ نقطهٔ پایانی
   * در panel/api ندارند — فقط سربرگ از دادهٔ واقعی زبان‌آموز پر می‌شود؛
   * بقیه به‌جای دادهٔ نمایشی جعلی، حالت صادقانهٔ «ساخته نشده» است.
   */
  if(API.live){
    return h`
    <div class="crumb"><a href="#/m/students">زبان‌آموزان</a><i class="chev"></i><span>${esc(s.name)}</span></div>
    <div class="card" style="margin-bottom:14px">

V["s/exam"]=function(){

  if(ex.done){
    var right=0;
    E.qs.forEach(function(q,i){if(ex.ans[i]===q.a)right++;});
    var pct=Math.round(right/E.qs.length*100);
    var lvl=pct>=84?"AEF 3A":pct>=67?"AEF 2B":pct>=50?"AEF 2A":pct>=34?"AEF 1B":"AEF 1A";
    return h`
    <div class="card" style="max-width:640px;margin-inline:auto">
      <div class="card-b" style="text-align:center;padding:32px 22px">
        <div style="inline-size:66px;block-size:66px;border-radius:50%;background:var(--ok-soft);color:var(--ok);

        <h2 style="font-size:21px">آزمون تمام شد</h2>
        <div class="num" style="font-size:44px;font-weight:300;margin-block:14px">${fa(right)} از ${fa(E.qs.length)}</div>
        <div style="display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:100px;
          background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:16px">

        <p class="muted" style="font-size:13.5px;margin-top:18px;line-height:1.95">
          این سطح روی پروندهٔ شما ثبت شد و کلاس‌های باز همین سطح را می‌بینید.
          تعیین سطح نهایی با مصاحبهٔ کوتاه مدرس تأیید می‌شود.</p>
        <div style="display:flex;gap:9px;justify-content:center;margin-top:20px;flex-wrap:wrap">
          <button class="btn btn--p" data-nav="s">دیدن کلاس‌های این سطح</button>
          <button class="btn btn--g" data-act="ex-review">مرور پاسخ‌ها</button>
        </div>
      </div>
    </div>`;
  }
  var q=E.qs[ex.i];
  var low=ex.left<60;
  return h`
  <div class="gbar">
    <span class="pill p-mute num">سوال ${fa(ex.i+1)} از ${fa(E.qs.length)}</span>
    <div class="mid"><b>${esc(E.title)}</b>
      <div class="gprog"><i style="width:${(ex.i+1)/E.qs.length*100}%;background:var(--brand)"></i></div></div>

  </div>
  <div class="grid g-side">
    <div class="card"><div class="card-b">
      <p style="font-size:18px;line-height:2;margin-bottom:18px" dir="auto">${esc(q.q)}</p>
      ${q.o.map(function(o,i){
        return '<button class="opt" role="radio" aria-checked="'+(ex.ans[ex.i]===i)+'" data-opt="'+i+'">'+
          '<span class="rd"></span><span dir="auto">'+esc(o)+'</span></button>';}).join("")}
      <div style="display:flex;gap:9px;margin-top:16px">
        <button class="btn btn--g" data-act="ex-prev" ${ex.i===0?"disabled":""}><i class="chev chev--r"></i> قبلی</button>
        ${ex.i<E.qs.length-1
          ?'<button class="btn btn--p" style="margin-inline-start:auto" data-act="ex-next">بعدی <i class="chev"></i></button>'
          :'<button class="btn btn--p" style="margin-inline-start:auto" data-act="ex-submit">پایان و مشاهدهٔ نتیجه</button>'}
      </div>
    </div></div>
    <div>

/** جیتسی لینک را خودش می‌سازد؛ فیلد لینک دستی برایش بی‌معناست */
function onClProvChange(){
  var p=(el("clProv")||{}).value||"meet";
  var note=el("clProvNote"); if(note)note.textContent=PROV_NOTE[p]||"";
  var wrap=el("clUrlWrap"); if(wrap)wrap.style.display=(p==="jitsi")?"none":"";
}

function readClass(){
  function v(id){var e=el(id);return e?e.value:"";}
  return {
    name:v("clName").trim(), level:v("clLevel").trim(), teacherId:v("clTeacher"),
    dayPattern:v("clDay"), time:enDigits(v("clTime")).trim(),
    cap:+enDigits(v("clCap"))||12, totalSessions:+enDigits(v("clTotal"))||20,
    mode:v("clMode"), roomId:v("clRoom"), provider:v("clProv"),
    joinUrl:v("clUrl").trim(),
    /* dateVal مقدار میلادی را از data-iso می‌خواند؛ رشتهٔ خالی یعنی
       «پاکش کن»، که سرور آن را از «نفرستادن» جدا می‌شناسد */
    startsOn:dateVal("clStart"), endsOn:dateVal("clEnd"),
    midtermOn:dateVal("clMid"), finalOn:dateVal("clFinal"),
    price:(+enDigits(v("clPrice").replace(/[٬,\s]/g,""))||0)*10
  };
}

function modalClass(id){
  var c=id?cls(id):null;
  openModal(h`
    <div class="modal-h"><h3>${c?"ویرایش کلاس":"کلاس تازه"}</h3>
      <button class="ib x" data-act="close" aria-label="بستن">✕</button></div>
    <div class="modal-b">${fieldsClass(c)}</div>
    <div class="modal-f">
      <button class="btn btn--g" data-act="close">انصراف</button>
      <button class="btn btn--p" data-act="cl-save" data-id="${id||""}">${c?"ذخیره":"ساخت کلاس"}</button>
    </div>`,true);

  /*
   * شنونده اینجا بسته می‌شود، نه با onchange درون‌خطی.
   *
   * کل این اسکریپت داخل یک IIFE است، پس onClProvChange سراسری نیست و
   * صفتِ onchange="onClProvChange()" به ReferenceError می‌خورد — بی‌صدا،
   * چون مرورگر خطای شنوندهٔ درون‌خطی را فقط در کنسول می‌نویسد.
   *
   * نتیجه‌اش این بود: مدیری که «جلسهٔ میت» را انتخاب می‌کرد، همچنان
   * فیلد «لینک ثابت جلسه» را می‌دید با راهنمای «برای کلاس آنلاین لازم
   * است» — لینکی که جیتسی خودش می‌سازد و اصلاً نباید تایپ شود. و متن
   * راهنما هم مال ارائه‌دهندهٔ قبلی می‌ماند.
   */
  var pv=el("clProv");
  if(pv){ pv.addEventListener("change",onClProvChange); onClProvChange(); }
}

/* ══════════ ضبط صدا (شبیه‌سازی) ══════════ */
function recTick(){
  S.rec.sec++;
  var t=el("recTime"); if(t)t.textContent=clock(S.rec.sec);
  var w=el("wave");
  if(w){Array.prototype.forEach.call(w.children,function(b,i){
    var v=6+Math.abs(Math.sin((S.rec.sec*1.7+i*0.55)))*26;
    b.style.height=v.toFixed(0)+"px";});}
  if(S.rec.sec>=120)stopRec();
}
function stopRec(){
  clearInterval(S.rec.timer); S.rec.timer=null; S.rec.on=false; S.rec.done=true;
  var b=el("recBtn"); if(b)b.classList.remove("on");
  var hnt=el("recHint"); if(hnt)hnt.textContent="ضبط شد. می‌توانید گوش کنید یا دوباره ضبط کنید.";
  var s=el("sendAudio"); if(s)s.disabled=false;
  var w=el("wave"); if(w){Array.prototype.forEach.call(w.children,function(b2,i){
    b2.style.height=(6+Math.abs(Math.sin(i*0.9))*22).toFixed(0)+"px";});}
}
function toggleRec(){
  if(S.rec.on){stopRec();return;}
  S.rec.on=true; S.rec.sec=0; S.rec.done=false;
  el("recBtn").classList.add("on");
  el("recHint").textContent="در حال ضبط… برای پایان دوباره بزنید";
  el("sendAudio").disabled=true;
  S.rec.timer=setInterval(recTick,1000);
}
function wordCount(){
  var t=el("subText"); if(!t)return;
  var n=t.value.trim()?t.value.trim().split(/\s+/).length:0;
  var wc=el("wc"); if(wc)wc.textContent=fa(n);
  var b=el("sendText"); if(b)b.disabled=n<20;
  S.subDraft=t.value;
}

/* مسیرهایی که تمام‌صفحه‌اند و پوستهٔ اپ را نشان نمی‌دهند */
var FULL={"auth":1,"signup":1,"nows":1,"susp":1,"meet":1,"pick":1};

function go(route){location.hash="#/"+route;}
function render(){
  var r=(location.hash||"#/t").replace(/^#\/?/,"")||"t";
  if(!V[r]){r=S.role==="student"?"s":S.role==="manager"?"m":"t";}

  /* دوربین/میکروفون جلسهٔ میت با آزادکردن منابع آن بسته می‌شود، نه با
     رهاکردنِ صرفِ DOM — وگرنه چراغ دوربین روشن می‌ماند. */
  if(S.route==="meet"&&r!=="meet")unmountJitsi();

  /*
   * نگهبان مسیر در حالت واقعی: نقش از سرور می‌آید، نه از آدرس.
   * وگرنه یک زبان‌آموز با تایپ #/m داشبورد مدیر را باز می‌کرد.
   * این جایگزین بررسی سمت سرور نیست؛ فقط جلوی رفتن به جای اشتباه را می‌گیرد.
   */
  if(API.live){
    /*
     * ثبت‌نام تنها صفحه‌ای است که کاربرِ واردنشده *و* کاربرِ تازه‌ساخته
     * هر دو باید ببینند: لحظهٔ بعد از ساخت حساب، نشست صادر شده و
     * API.user پر است، ولی کاربر هنوز روی صفحهٔ «حساب شما ساخته شد»
     * ایستاده. اگر نگهبان همان‌جا او را به داشبورد بیندازد، هیچ‌وقت
     * نمی‌فهمد درخواستش در صف نشسته یا آموزشگاهش ساخته شده.
     */
    if(r==="signup"&&(!API.user||S.su.done)){ /* بگذار بماند */ }
    else if(!API.user){ r="auth"; }
    else if(API.pickContext){ r="pick"; }
    else if(API.suspended){ r="susp"; }
    else if(API.noWorkspace){ r="nows"; }
    else if(r==="auth"||r==="nows"||r==="susp"||r==="pick"){ r=roleRoute(API.user.role); }
    /* اعلان‌نویسی مسیر مشترک است: مدیر و مدرس هر دو به همان صفحه
       می‌روند و محدودهٔ مجوز تعیین می‌کند چه مخاطبی می‌بینند */
    else if(r==="compose"){ /* بگذار بماند */ }
    else if(r.split("/")[0]!==roleRoute(API.user.role)){ r=roleRoute(API.user.role); }
    if("#/"+r!==location.hash){ location.replace("#/"+r); }
  }

  if(FULL[r]){
    document.body.classList.add("full-mode");
    el("full").classList.add("on");
    el("full").innerHTML=V[r]();
    S.route=r; window.scrollTo(0,0);
    if(r==="meet"){mountJitsi();}
    else{var f=el("full").querySelector("input"); if(f)f.focus();}
    return;
  }
  document.body.classList.remove("full-mode");
  el("full").classList.remove("on"); el("full").innerHTML="";

  var first=r.split("/")[0];
  S.role=first==="s"?"student":first==="m"?"manager":"teacher";
  S.route=r;
  el("pageTitle").textContent=TITLES[r]||"تاکورا";
  el("page").innerHTML=V[r]();
  renderNav();
  el("side").classList.remove("open"); el("scrim").classList.remove("on");
  if(r==="s/exam"&&S.exam.on&&!S.exam.timer){startExamTimer();}
  if(r!=="s/exam"&&S.exam.timer){clearInterval(S.exam.timer);S.exam.timer=null;}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ── تایمر آزمون ── */
function startExamTimer(){
  S.exam.timer=setInterval(function(){
    S.exam.left--;
    var t=el("exTime");
    if(t){t.textContent=clock(Math.max(0,S.exam.left));
      t.classList.toggle("low",S.exam.left<60);}
    if(S.exam.left<=0){clearInterval(S.exam.timer);S.exam.timer=null;
      S.exam.done=true;S.exam.on=false;
      toast("زمان آزمون تمام شد و پاسخ‌ها خودکار ثبت شدند");render();}
  },1000);
}

/* ── تایمر ابزار کلاس ── */
function tickTool(){
  S.tools.timer--;
  var d=el("tmDisp"); if(d)d.textContent=clock(Math.max(0,S.tools.timer));
  if(S.tools.timer<=0){clearInterval(S.tools.tk);S.tools.tk=null;S.tools.run=false;
    toast("وقت تمام شد");render();}
}

/* ══════════ رویدادها ══════════ */
document.addEventListener("click",function(e){
  var t=e.target;

  var navBtn=t.closest("[data-nav]");
  if(navBtn){e.preventDefault();go(navBtn.dataset.nav);return;}

  // هم انتخابگر نوار بالا، هم دکمه‌های صفحهٔ انتخاب نقش
  var ctxBtn=t.closest("[data-ctx]");
  if(ctxBtn){switchContext(ctxBtn.dataset.ctx);return;}

  var roleBtn=t.closest("#roleSw button[data-role]");
  if(roleBtn){var r=roleBtn.dataset.role;
    go(r==="student"?"s":r==="manager"?"m":"t");return;}

  /* حضور و غیاب */
  var segBtn=t.closest(".seg button");
  /*
   * فقط ردیف‌های حضورِ نمایشی (.rrow). مودال حضور واقعی هم دکمه‌های .seg
   * دارد ولی داخل .att-row است و کنترل‌کنندهٔ [data-att] رسیدگی‌اش می‌کند.
   * بدون این شرط، کلیک در مودال واقعی اینجا می‌افتاد و روی null می‌شکست.
   */
  if(segBtn&&segBtn.closest(".rrow")){
    var row=segBtn.closest(".rrow"), sid=row.dataset.sid, v=segBtn.dataset.v;
    S.att[sid]=v;
    Array.prototype.forEach.call(segBtn.parentNode.children,function(b){
      b.classList.toggle("on",b===segBtn);});
    row.dataset.st=(v==="absent")?"absent":"";
    var c=countAtt();
    if(el("cOk"))el("cOk").textContent=fa(c.p)+" حاضر";
    if(el("cLate"))el("cLate").textContent=fa(c.l)+" تأخیر";
    if(el("cNo"))el("cNo").textContent=fa(c.a)+" غایب";
    return;
  }

  /* روبریک */
  var scaleBtn=t.closest(".scale button");
  if(scaleBtn){
    var crit=scaleBtn.closest(".scale").dataset.crit;
    var subs=DB.submissions.filter(function(x){return x.aid==="a1";});
    var sid2=subs[Math.min(S.grade.idx,subs.length-1)].sid;
    S.grade.scores[sid2]=S.grade.scores[sid2]||{};
    S.grade.scores[sid2][crit]=+scaleBtn.dataset.n;
    Array.prototype.forEach.call(scaleBtn.parentNode.children,function(b){
      b.classList.toggle("on",b===scaleBtn);});
    var tot=rubTotal(sid2);
    el("rubTotal").innerHTML=tot==null?'<i class="dash"></i>':fa(tot)+" از ۲۰";
    return;
  }

  var phraseBtn=t.closest(".phrase");
  if(phraseBtn){
    var fb=el("fb");
    fb.value=(fb.value?fb.value.replace(/\s*$/,"")+" ":"")+phraseBtn.dataset.phrase+".";
    fb.focus(); return;
  }

  /* ارائه‌دهنده */
  var provBtn=t.closest("[data-prov]");
  if(provBtn){
    S.provider=provBtn.dataset.prov;
    Array.prototype.forEach.call(provBtn.parentNode.children,function(b){
      b.setAttribute("aria-checked",b===provBtn?"true":"false");});
    return;
  }
  var sw=t.closest(".sw");
  if(sw){sw.setAttribute("aria-checked",sw.getAttribute("aria-checked")==="true"?"false":"true");return;}

  /* انتخاب سطح در ثبت‌نام */
  var lvlBtn=t.closest("[data-lvl]");
  if(lvlBtn){S.enrol.level=lvlBtn.dataset.lvl;render();return;}
  var planBtn=t.closest("[data-plan]");
  if(planBtn){S.enrol.plan=planBtn.dataset.plan;render();return;}
  var clsPick=t.closest("[data-cls-pick]");
  if(clsPick){S.enrol.clsId=clsPick.dataset.clsPick;render();return;}

  /* گزینهٔ آزمون */
  var optBtn=t.closest("[data-opt]");
  if(optBtn&&optBtn.classList.contains("opt")){
    S.exam.ans[S.exam.i]=+optBtn.dataset.opt;
    Array.prototype.forEach.call(optBtn.parentNode.querySelectorAll(".opt"),function(b){
      b.setAttribute("aria-checked",b===optBtn?"true":"false");});
    var qn=document.querySelector('[data-goq="'+S.exam.i+'"]');
    if(qn)qn.classList.add("ans");
    return;
  }
  var goq=t.closest("[data-goq]");
  if(goq){S.exam.i=+goq.dataset.goq;render();return;}

  /* ویرایش ردیف ترم‌ساز */
  var act=t.closest("[data-act]");
  if(!act)return;
  var a=act.dataset.act;





  /* ── تکلیف: تمدید و فهرست تحویل ── */
  if(a==="asg-open"){ openAsgStatus(act.dataset.id); return; }
  if(a==="asg-extend"||a==="asg-unextend"){
    var body={action:"extend",id:act.dataset.id};
    if(a==="asg-extend"){
      var iso=dateVal("exDate");
      if(!iso){toast("تاریخ تمدید را انتخاب کنید");return;}
      body.toDate=iso;
      body.toTime="23:59";
      body.note=((el("exNote")||{}).value||"").trim();
    }
    apiCall("assignments.php",body).then(function(r){
      if(!r.ok){toast(r.message||"انجام نشد");return;}
      toast(a==="asg-extend"
        ? "مهلت تمدید شد"+(r.noLongerLate?"، "+fa(r.noLongerLate)+" تحویل دیگر دیر نیست":"")
        : "تمدید برداشته شد");
      openAsgStatus(body.id);
      reload();
    });
    return;
  }
  if(a==="asg-remind"){
    /*
     * یادآوری از همان سامانهٔ اعلان می‌رود، نه یک مسیر جدا.
     *
     * مخاطبش کل کلاس است نه فقط نداده‌ها — چون اعلان به فهرستِ
     * ثابتِ لحظهٔ ارسال می‌رود و «نداده‌ها» تا فردا عوض می‌شود.
     * متن روشن می‌کند که برای چه کسی است.
     */
    var d=S.asgStat;
    if(!d)return;
    var cls=(DB.assignments.filter(function(x){return x.id===d.assignment.id;})[0]||{}).cls;
    if(!cls){toast("کلاس این تکلیف پیدا نشد");return;}
    var miss=d.students.filter(function(s){return !s.submitted;}).map(function(s){return s.name;});
    apiCall("notify.php",{action:"send",audience:"class:"+cls,kind:"warn",
      title:"یادآوری تکلیف: "+d.assignment.title,
      body:"این تکلیف را هنوز تحویل نداده‌اید: "+miss.join("، ")
         +(d.assignment.effective?"\nمهلت تا "+jDateTime(d.assignment.effective)+".":"")
    }).then(function(r){
      toast(r.ok?"یادآوری به "+fa(r.recipients)+" نفر رفت":(r.message||"فرستاده نشد"));
    });
    return;
  }

  /* ── اعلان ── */
  if(a==="ntf-bell"){
    S.notif.open=!S.notif.open;
    var wrap=el("notifPanel");
    if(S.notif.open){
      /* کشویی جدا از render ساخته می‌شود تا بازکردنش صفحهٔ زیرش را
         بازنسازد — فرمِ نیمه‌پرشده نباید با یک کلیک روی زنگ پاک شود */
      if(!wrap){
        var holder=document.createElement("div");
        holder.innerHTML=notifPanel();
        el("notifHost").appendChild(holder.firstElementChild);
      }
      notifLoad();
    }else{ notifClose(); }
    return;
  }
  if(a==="ntf-all"){
    apiCall("notify.php",{action:"read"}).then(function(){
      S.notif.unread=0;
      (S.notif.items||[]).forEach(function(n){n.read=true;});
      notifPaint();
    });
    return;
  }
  if(a==="ntf-open"){
    var nid2=act.dataset.id, lnk=act.dataset.link||"";
    var hit=(S.notif.items||[]).filter(function(n){return n.id===nid2;})[0];
    if(hit&&!hit.read){
      hit.read=true; S.notif.unread=Math.max(0,S.notif.unread-1); notifPaint();
      apiCall("notify.php",{action:"read",ids:[nid2]});
    }
    if(lnk){ notifClose(); go(lnk); }
    return;
  }
  if(a==="ntf-compose"){ notifCompose(); go("compose"); return; }
  if(a==="ntf-retry"){ S.compose.auds=null; S.compose.err=""; composeLoad(); render(); return; }
  if(a==="ntf-back"){ go(roleRoute((API.user||{}).role||"teacher")); return; }
  if(a==="ntf-aud"){
    ntfRead(); S.compose.audience=act.dataset.key; S.compose.err=""; render(); return;
  }
  if(a==="ntf-kind"){
    ntfRead(); S.compose.kind=act.dataset.kind; render(); return;
  }
  if(a==="ntf-send"){
    if(S.compose.busy)return;
    ntfRead();
    var c=S.compose;
    if(!c.audience){ c.err="اول مخاطب را انتخاب کنید."; render(); return; }
    if(!(c.title||"").trim()){ c.err="عنوان را بنویسید."; render(); return; }
    if(!(c.body||"").trim()){ c.err="متن اعلان را بنویسید."; render(); return; }

    c.busy=true; c.err=""; render();
    apiCall("notify.php",{action:"send",audience:c.audience,
                          title:c.title.trim(),body:c.body.trim(),kind:c.kind}).then(function(r){
      S.compose.busy=false;
      if(!r.ok){ S.compose.err=r.message||"فرستاده نشد."; render(); return; }
      S.compose.title=""; S.compose.body="";
      toast("به "+fa(r.recipients)+" نفر فرستاده شد — "+r.audience);
      /* سابقه بعد از ارسال گرفته می‌شود، نه پیش از آن: فرستنده تازه
         آنجاست که می‌خواهد ببیند چند نفر خواندند */
      apiCall("notify.php",{action:"sent"}).then(function(s){
        if(s&&s.ok)S.compose.sent=s.sent||[];
        render();
      });
      notifLoad();
    });
    return;
  }

  /* ── کد پیوستن و صف درخواست ── */
  if(a==="jc-refresh"){ joinLoad(true); toast("تازه‌سازی شد"); return; }
  if(a==="jc-copy"){
    var t=(S.join.code||{}).code||"";
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast("کد رونوشت شد");},
                                           function(){toast("رونوشت نشد — دستی بردارید");});
    }else{
      /* بدون HTTPS، clipboard در دسترس نیست. انتخاب متن دست‌کم یک
         ctrl+c را ممکن می‌کند به‌جای اینکه دکمه بی‌صدا کاری نکند. */
      var n=el("jcCode");
      if(n&&window.getSelection){
        var rg=document.createRange(); rg.selectNodeContents(n);
        var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
        toast("کد انتخاب شد — با Ctrl+C بردارید");
      }
    }
    return;
  }
  if(a==="jc-save"||a==="jc-rotate"){
    if(S.join.busy)return;
    var body={action:"joinCodeSet",
              role:((el("jcRole")||{}).value)||"student",
              active:(el("jcActive")||{}).checked!==false};
    /* چرخاندن یعنی کد تازه، پس باید فعال هم باشد — وگرنه مدیر کدی
       می‌سازد که هیچ‌کس نمی‌تواند با آن عضو شود و دلیلش را نمی‌فهمد. */
    if(a==="jc-rotate"){ body.rotate=true; body.active=true; }
    S.join.busy=true; render();
    apiCall("institute.php",body).then(function(r){
      S.join.busy=false;
      if(!r.ok){toast(r.message||"ذخیره نشد");render();return;}
      S.join.code={code:r.code,role:r.role,active:r.active,
                   requests:(S.join.code||{}).requests};
      render();
      toast(a==="jc-rotate"?"کد تازه ساخته شد؛ کد قبلی از کار افتاد":"ذخیره شد");
    });
    return;
  }
  if(a==="jr-ok"||a==="jr-no"){
    if(S.join.busy)return;
    var rid=act.dataset.id;
    var sel2=document.querySelector('[data-req-role="'+rid+'"]');
    var body2=a==="jr-ok"
      ? {action:"approveRequest",id:rid,role:(sel2&&sel2.value)||"student"}
      : {action:"declineRequest",id:rid};
    S.join.busy=true; render();
    apiCall("institute.php",body2).then(function(r){
      S.join.busy=false;
      if(!r.ok){toast(r.message||"انجام نشد");render();return;}
      /* از صف برداشته می‌شود، بعد صف از سرور تازه می‌شود. برداشتنِ
         محلی برای این است که ردیف همان لحظه برود؛ تازه‌سازی برای این
         که اگر مدیر دیگری هم‌زمان چیزی را بررسی کرده، دیده شود. */
      S.join.reqs=(S.join.reqs||[]).filter(function(q){return q.id!==rid;});
      render();
      toast(a==="jr-ok"
        ? "عضو شد — "+(SU_ROLES[r.role]||"کاربر")
        : "درخواست رد شد");
      joinLoad(true);
      reload();
    });
    return;
  }

  /* ── ثبت‌نام ── */
  if(a==="su-path"){
    suRead();
    S.su.path=act.dataset.path; S.su.err="";
    /* انتخاب راه، مقصدِ راه قبلی را باطل می‌کند. اگر پاکشان نکنیم،
       کسی که از «کد» به «درخواست» رفته با یک کدِ تأییدشدهٔ نامربوط
       در حافظه می‌ماند و در گام آخر به آموزشگاه اشتباه می‌پیوندد. */
    S.su.codeInst=null; S.su.instId=""; S.su.insts=null;
    if(S.su.path!=="manager")S.su.instName="";
    render(); return;
  }
  if(a==="su-open"){ go("signup"); return; }
  if(a==="su-to-login"){ S.auth.mode="pass"; S.auth.step=1; go("auth"); return; }
  if(a==="su-enter"){ go(roleRoute((API.user||{}).role||"student")); return; }
  if(a==="su-back"){ suRead(); S.su.step=Math.max(1,S.su.step-1); S.su.err=""; render(); return; }
  if(a==="su-unpick"){ suRead(); S.su.instId=""; S.su.instName=""; S.su.insts=null; S.su.instQ=""; render(); return; }
  if(a==="su-pick-inst"){
    suRead();
    S.su.instId=act.dataset.id; S.su.instName=act.dataset.name; S.su.err=""; render(); return;
  }
  if(a==="su-check-code"){
    if(S.su.busy)return;
    suRead();
    var cd=(S.su.code||"").trim();
    if(cd.length<4){suErr("کد را کامل وارد کنید.");return;}
    S.su.busy=true; S.su.err=""; render();
    apiCall("signup.php",{action:"checkCode",code:cd}).then(function(r){
      S.su.busy=false;
      if(!r.ok){suErr(r.message||"کد پیدا نشد.");return;}
      S.su.codeInst=r.institute; S.su.err=""; render();
    });
    return;
  }

  /* ── حرکت بین گام‌ها ──
     اعتبارسنجی همین‌جا انجام می‌شود، نه فقط روی سرور. سرور هم بررسی
     می‌کند — این نسخه جایگزینش نیست — ولی کاربر نباید سه گام جلو برود
     و بعد بفهمد نامش را ننوشته. */
  if(a==="su-next"){
    suRead();
    var u=S.su;
    if(u.step===1){
      if(u.path==="manager"&&!(u.instName||"").trim()){suErr("نام آموزشگاه را وارد کنید.");return;}
      if(u.path==="code"&&!u.codeInst){suErr("اول کد را بررسی کنید.");return;}
      if(u.path==="request"&&!u.instId){suErr("آموزشگاه را از فهرست انتخاب کنید.");return;}
      u.step=2; u.err=""; render(); return;
    }
    if(!(u.fnFa||"").trim()||!(u.lnFa||"").trim()){suErr("نام و نام خانوادگی فارسی لازم است.");return;}
    var nid=enDigits(u.nid||"").replace(/\D/g,"");
    if(nid&&!nationalIdOk(nid)){suErr("کد ملی درست نیست. دوباره بررسی کنید.");return;}
    if((u.by&&(!u.bm||!u.bd))||(u.bm&&(!u.by||!u.bd))||(u.bd&&(!u.by||!u.bm))){
      suErr("تاریخ تولد را کامل کنید، یا هر سه خانه را خالی بگذارید.");return;}
    u.step=3; u.err=""; render(); return;
  }

  if(a==="su-submit"){
    if(S.su.busy)return;
    suRead();
    var v=S.su, ph=enDigits(v.phone||"").replace(/\D/g,"");
    if(!/^09\d{9}$/.test(ph)){suErr("شمارهٔ موبایل باید ۱۱ رقم و با ۰۹ شروع شود.");return;}
    if((v.p1||"").length<8){suErr("رمز باید حداقل ۸ نویسه باشد.");return;}
    if(/^\d+$/.test(v.p1)){suErr("رمز نمی‌تواند فقط عدد باشد.");return;}
    if(v.p1!==v.p2){suErr("تکرار رمز با خودش نمی‌خواند.");return;}

    var body={action:"register", mode:v.path, phone:ph, password:v.p1,
              firstNameFa:(v.fnFa||"").trim(), lastNameFa:(v.lnFa||"").trim(),
              firstNameEn:(v.fnEn||"").trim(), lastNameEn:(v.lnEn||"").trim(),
              nationalId:enDigits(v.nid||"").replace(/\D/g,""),
              gender:v.gender||"", email:(v.email||"").trim(), city:(v.city||"").trim()};
    /* تاریخ شمسی می‌رود؛ سرور میلادی ذخیره می‌کند — بند P.2 */
    if(v.by&&v.bm&&v.bd)body.birthDate=v.by+"-"+pad(+v.bm)+"-"+pad(+v.bd);
    if(v.path==="manager")body.instituteName=(v.instName||"").trim();
    if(v.path==="code")body.code=(v.code||"").trim();
    if(v.path==="request"){body.instituteId=v.instId; body.role=v.role||"student";
                           body.message=(v.msg||"").trim();}

    S.su.busy=true; S.su.err=""; render();
    apiCall("signup.php",body).then(function(r){
      S.su.busy=false;
      if(!r.ok){
        /* خطاهای مربوط به گام‌های قبل، کاربر را به همان گام برمی‌گردانند.
           وگرنه پیام «کد ملی تکراری» زیر خانهٔ رمز ظاهر می‌شد و کاربر
           نمی‌دانست کجا را درست کند. */
        if(r.error==="bad_national_id"||r.error==="nid_taken"||r.error==="bad_birth"||r.error==="bad_email"){
          S.su.step=2;
        }else if(r.error==="bad_code"||r.error==="no_institute"){
          S.su.step=1; S.su.codeInst=null;
        }
        suErr(r.message||"ثبت‌نام انجام نشد.");
        return;
      }
      S.su.done=r.outcome; S.su.doneInst=r.institute||""; S.su.doneRole=r.role||"";
      S.su.p1=""; S.su.p2="";
      /* نشست همین حالا صادر شده. داده را می‌گیریم تا وقتی کاربر
         «شروع کنیم» را زد، پنل پر باشد نه خالی. */
      apiCall("me.php").then(function(m){ if(m&&m.ok&&m.user)applyUser(m.user); reload(); });
      render();
    });
    return;
  }

  /* ── ورود ── */
  if(a==="au-mode-pass"||a==="au-mode-otp"||a==="au-mode-signup"||a==="au-mode-forgot"){
    var m=a.slice(8);                       /* pass | otp | signup | forgot */
    S.auth.mode=m; S.auth.newInst=(m==="signup");
    S.auth.step=1; S.auth.err=""; S.auth.code=""; clearAuthSecrets();
    stopCooldown(); stopSmsWatch(); render();
    return;
  }
  if(a==="au-toggle-pass"){
    /*
     * هرچه کاربر تا اینجا تایپ کرده را *قبل* از render برمی‌داریم.
     *
     * render فرم را از روی S می‌سازد. اگر نام و نام آموزشگاه را نگه
     * نداریم، زدنِ تیکِ «رمز هم بسازم» آن‌ها را پاک می‌کند — و کاربر
     * فکر می‌کند فرم خراب است، نه اینکه خودش چیزی را از دست داده.
     */
    readProfileFields();
    var cb=el("auWantPass");
    S.auth.wantPass=cb?cb.checked:!S.auth.wantPass;
    render();
    var f=el("auUser2"); if(f&&S.auth.wantPass)f.focus();
    return;
  }
  if(a==="au-login"){
    if(S.auth.busy)return;
    var lu=((el("lgUser")||{}).value||"").trim(), lp=(el("lgPass")||{}).value||"";
    S.auth.user=lu;
    if(!lu||!lp){authErr("نام کاربری و رمز را وارد کنید.");return;}
    if(!API.live){go("m");toast("خوش آمدید");return;}
    S.auth.busy=true; S.auth.err=""; render();
    apiCall("login.php",{username:lu,password:lp}).then(function(r){
      S.auth.busy=false;
      if(!r.ok){authErr(r.message||"ورود نشد.");return;}
      /* داده را از سرور می‌گیریم، نه از پاسخ ورود: نقش و آموزشگاه
         تعیین‌کنندهٔ مسیرند و باید از منبع اصلی بیایند */
      applyUser(r.user);
      reload(function(b){
        if(b&&!b.ok&&b.error==="no_institute"){API.noWorkspace=true;go("nows");render();return;}
        go(roleRoute(r.user.role)); render();
        toast("خوش آمدید، "+r.user.name);
      });
    });
    return;
  }
  if(a==="au-reset"){
    if(S.auth.busy)return;
    readProfileFields();
    var p1=S.auth.p1, p2=S.auth.p2;
    if(p1.length<8){authErr("رمز باید حداقل ۸ نویسه باشد.");return;}
    if(/^\d+$/.test(p1)){authErr("رمز نمی‌تواند فقط عدد باشد.");return;}
    if(p1!==p2){authErr("تکرار رمز با خودش نمی‌خواند.");return;}
    S.auth.busy=true; S.auth.err=""; render();
    apiCall("account.php",{action:"resetPassword",phone:S.auth.phone,code:S.auth.code,password:p1}).then(function(r){
      S.auth.busy=false;
      if(!r.ok){authErr(r.message||"ثبت نشد.");return;}
      S.auth.mode="pass"; S.auth.step=1; S.auth.err=""; S.auth.code="";
      clearAuthSecrets(); render();
      toast("رمز عوض شد. حالا با رمز تازه وارد شوید.");
    });
    return;
  }
  else if(a==="au-send"||a==="au-resend"){
    if(S.auth.busy)return;
    var ph=a==="au-resend"?S.auth.phone
                          :enDigits((el("auPhone")||{}).value||"").replace(/\s/g,"");
    if(!/^09\d{9}$/.test(ph)){authErr("شمارهٔ موبایل باید ۱۱ رقم و با ۰۹ شروع شود.");return;}

    S.auth.phone=ph; S.auth.err="";
    if(!API.live){
      /* حالت نمایشی: پیامکی در کار نیست */
      S.auth.step=2; startCooldown(60); render();
      toast(a==="au-resend"?"کد دوباره ارسال شد":"کد به "+fa(ph)+" پیامک شد");
      return;
    }
    S.auth.busy=true; render();
    apiCall("otp-request.php",{phone:ph}).then(function(r){
      S.auth.busy=false;
      if(!r.ok){
        /* «کمی صبر کنید» خطا نیست، فقط فاصلهٔ ارسال است — کاربر را به عقب برنگردانیم */
        if(r.error==="cooldown"){
          /*
           * کد قبلی هنوز زنده است و همان به درد می‌خورد. ولی پاسخ
           * cooldown چیزی دربارهٔ حالت پیامک نمی‌گوید، پس از health
           * برش می‌داریم — وگرنه در حالت پل به کاربر می‌گفتیم «پیامک
           * شد» و او منتظر پیامکی می‌ماند که اصلاً فرستاده نشده.
           */
          S.auth.bridge=!!API.bridge;
          S.auth.step=2;startCooldown(r.retryAfter||60);render();
          watchSmsCode();
          return;
        }
        authErr(r.message||"ارسال کد ممکن نشد."); return;
      }
      /* در حالت پل پیامکی نرفته؛ گفتن «پیامک شد» یعنی کاربر منتظر
         چیزی می‌ماند که هرگز نمی‌آید. */
      S.auth.bridge=!!r.bridge; S.auth.expires=r.expiresIn||300;
      S.auth.step=2; startCooldown(r.resendAfter||60); render();
      /* از همین لحظه منتظر پیامک می‌مانیم؛ اگر گوشی پشتیبانی کند خودش پر می‌شود */
      watchSmsCode();
      toast(r.bridge?"کد ساخته شد؛ از مدیر آموزشگاه بگیرید":"کد به "+fa(ph)+" پیامک شد");
    });
  }
  else if(a==="au-back"){S.auth.step=1;S.auth.err="";stopCooldown();stopSmsWatch();render();}
  else if(a==="au-verify"){
    if(S.auth.busy)return;
    var code=otpValue();
    if(code.length!==5){authErr("هر پنج رقم کد را وارد کنید.");return;}
    stopSmsWatch();   // کد در دست است؛ دیگر لازم نیست منتظر پیامک بمانیم
    if(!API.live){
      if(S.auth.newInst){S.auth.step=3;S.auth.err="";render();}
      else{stopCooldown();go("m");toast("خوش آمدید");}
      return;
    }
    S.auth.code=code; S.auth.err="";
    /*
     * در بازیابی رمز، کد را همین‌جا مصرف نمی‌کنیم.
     * account.php خودش کد را می‌خواهد و همان‌جا می‌سوزاندش — اگر اینجا
     * otp-verify صدا می‌زدیم، کاربر وارد حسابش می‌شد بدون اینکه رمزی
     * ساخته باشد، و کد هم دیگر برای ثبت رمز تازه معتبر نبود.
     */
    if(S.auth.mode==="forgot"){ S.auth.step=3; stopSmsWatch(); render(); return; }
    S.auth.busy=true; render();
    verifyOtp();
  }
  else if(a==="au-profile"){
    if(S.auth.busy)return;
    readProfileFields();
    var pn=S.auth.name;
    if(!pn){authErr("نام‌تان را وارد کنید.");return;}
    if(S.auth.mode==="signup"&&!S.auth.inst){authErr("نام آموزشگاه را وارد کنید.");return;}

    if(S.auth.wantPass){
      var un=S.auth.user;
      var q1=S.auth.p1, q2=S.auth.p2;
      if(!/^[a-z0-9._-]{4,64}$/.test(un)){
        authErr("نام کاربری بین ۴ تا ۶۴ نویسه و فقط حروف انگلیسی کوچک، رقم، نقطه و خط تیره.");return;}
      if(q1.length<8){authErr("رمز باید حداقل ۸ نویسه باشد.");return;}
      if(/^\d+$/.test(q1)){authErr("رمز نمی‌تواند فقط عدد باشد.");return;}
      if(q1!==q2){authErr("تکرار رمز با خودش نمی‌خواند.");return;}
      S.auth.newPass=q1;
    }else{
      S.auth.newPass="";
    }

    S.auth.err=""; S.auth.busy=true; render();
    verifyOtp();
  }
  else if(a==="nw-create"){
    var nwi=((el("nwInst")||{}).value||"").trim();
    if(!nwi){S.auth.err="نام آموزشگاه را وارد کنید.";render();return;}
    S.auth.err="";
    apiCall("workspace.php",{action:"create",name:nwi}).then(function(r){
      if(!r.ok){S.auth.err=r.message||"ساخته نشد.";render();return;}
      API.noWorkspace=false;
      applyUser({name:(API.user&&API.user.name)||nwi,role:"manager",institute:nwi});
      reload(function(){go("m");toast("آموزشگاه «"+nwi+"» ساخته شد");});
    });
  }
  else if(a==="au-finish"){
    if(S.auth.inst)DB.institute.name=S.auth.inst;
    S.onboard.profile=true; S.onboard.levels=true;
    go("m"); toast("فضای کاری «"+DB.institute.name+"» ساخته شد");
  }
  else if(a==="logout"){
    stopCooldown();
    S.auth={step:1,phone:"",inst:"",name:"",code:"",err:"",busy:false,cool:0,tick:null,newInst:false};
    if(API.live){apiCall("logout.php",{}).then(function(){API.user=null;go("auth");render();});}
    else go("auth");
  }

  /* ── ترم‌ساز ── */
  else if(a==="tm-step"){S.term.step=+act.dataset.n;render();}
  else if(a==="tm-del"){
    var id=+act.dataset.id;
    S.term.rows=S.term.rows.filter(function(r){return r.id!==id;});
    render(); toast("کلاس حذف شد");
  }
  else if(a==="tm-add"){
    var nid=Math.max.apply(null,S.term.rows.map(function(r){return r.id;}))+1;
    S.term.rows.push({id:nid,course:"دورهٔ جدید",level:"",day:"فرد",time:"۱۸:۰۰",
                      teacher:"",room:"r1",cap:14,price:13500000});
    render();
  }
  else if(a==="tm-publish"){
    toast("ترم منتشر شد؛ "+fa(S.term.rows.length*20)+" جلسه ساخته شد و کمپین تمدید اجرا شد");
    S.onboard.term=true; go("m");
  }

  /* ── ثبت‌نام زبان‌آموز ── */
  else if(a==="en-step"){
    var n=+act.dataset.n;
    if(n===2&&S.enrol.step===1){
      var nm=(el("enName")||{}).value||"", pp=enDigits((el("enPhone")||{}).value||"");
      if(!nm.trim()){toast("نام زبان‌آموز را وارد کنید");return;}
      if(!/^09\d{9}$/.test(pp)){toast("شمارهٔ موبایل معتبر نیست");return;}
      S.enrol.name=nm; S.enrol.phone=pp;
    }
    if(n===3&&!S.enrol.level){toast("روش تعیین سطح را انتخاب کنید");return;}
    if(n===4&&!S.enrol.clsId){toast("یک کلاس انتخاب کنید");return;}
    S.enrol.step=n; render();
  }
  else if(a==="en-pay"){
    var who=S.enrol.name||"زبان‌آموز";
    toast("ثبت‌نام "+esc(who)+" کامل شد؛ رسید و برنامهٔ کلاسی پیامک شد");
    S.enrol={step:1,name:"",phone:"",level:"",clsId:"",plan:"instal",paid:false};
    go("m/students");
  }
  else if(a==="go-exam"){go("s/exams");}

  /* ── آزمون ── */
  else if(a==="ex-start"){
    S.exam={on:true,i:0,ans:{},left:DB.exam.minutes*60,timer:null,done:false};
    go("s/exam");
  }
  else if(a==="ex-next"){if(S.exam.i<DB.exam.qs.length-1){S.exam.i++;render();}}
  else if(a==="ex-prev"){if(S.exam.i>0){S.exam.i--;render();}}
  else if(a==="ex-submit"){
    var un=DB.exam.qs.length-Object.keys(S.exam.ans).length;
    if(un>0&&!act.dataset.sure){
      act.dataset.sure="1"; toast(fa(un)+" سوال بی‌پاسخ است. دوباره بزنید تا ثبت شود.");return;}
    if(S.exam.timer){clearInterval(S.exam.timer);S.exam.timer=null;}
    S.exam.done=true;S.exam.on=false;render();
  }
  else if(a==="ex-review"){toast("مرور پاسخ‌ها در نسخهٔ کامل، هر سوال را با پاسخ درست نشان می‌دهد.");}

  /* ── ابزار حین کلاس ── */
  else if(a==="tl-set"){S.tools.timer=+act.dataset.s;S.tools.started=true;
    if(S.tools.tk){clearInterval(S.tools.tk);S.tools.tk=null;S.tools.run=false;}render();}
  else if(a==="tl-toggle"){
    if(S.tools.run){clearInterval(S.tools.tk);S.tools.tk=null;S.tools.run=false;}
    else{if(S.tools.timer<=0){toast("اول یک مدت انتخاب کنید");return;}
      S.tools.run=true;S.tools.started=true;S.tools.tk=setInterval(tickTool,1000);}
    render();
  }
  else if(a==="tl-pick"){
    var pool=DB.students.filter(function(s){return (S.tools.used||[]).indexOf(s.id)<0;});
    if(!pool.length){toast("همه یک‌بار انتخاب شدند. دور جدید را شروع کنید.");return;}
    var pick=pool[Math.floor(Math.random()*pool.length)];
    S.tools.used=(S.tools.used||[]).concat([pick.id]);
    S.tools.picked=pick.name; render();
  }
  else if(a==="tl-reset"){S.tools.used=[];S.tools.picked="";render();toast("دور جدید شروع شد");}
  else if(a==="tl-poll"){
    S.tools.poll=[0,0,0]; render();
    toast("نظرسنجی برای ۸ نفر ارسال شد");
    var n=0, iv=setInterval(function(){
      if(!S.tools.poll||n>=8){clearInterval(iv);return;}
      S.tools.poll[Math.floor(Math.random()*3)]++; n++;
      if(S.route==="t/tools")render();
    },700);
  }
  else if(a==="tl-poll-end"){S.tools.poll=null;render();toast("نظرسنجی بسته شد");}

  else if(a==="close"){closeModal();}
  else if(a==="start-class"){modalStartClass(act.dataset.cls);}
  else if(a==="do-start"){
    var rec=el("modal").querySelector('[data-opt="record"]').getAttribute("aria-checked")==="true";
    S.live={classId:act.dataset.cls,provider:S.provider,record:rec,joined:1};
    closeModal();
    toast("کلاس روی "+providerName(S.provider)+" شروع شد");
    var c2=cls(S.live.classId);
    setTimeout(function(){ if(S.live){S.live.joined=Math.min(c2.enrolled,11); render();
      toast("زبان‌آموزها در حال ورودند، "+fa(S.live.joined)+" نفر داخل کلاس");}},1400);
    render();
  }
  else if(a==="open-room"){modalRoom();}
  else if(a==="end-class"){
    var prov=S.live.provider; S.live=null; closeModal(); render();
    if(prov==="meet"){toast("کلاس پایان یافت. حضور و غیاب را دستی ثبت کنید.");}
    else{toast("کلاس پایان یافت. حضور و غیاب خودکار آماده است."); }
  }
  else if(a==="join-class"){
    if(S.live)S.live.joined++;
    toast("وارد کلاس شدید. حضورتان خودکار ثبت می‌شود.");
    render();
  }
  else if(a==="all-present"){
    DB.students.forEach(function(s){S.att[s.id]="present";});
    el("roster").innerHTML=rosterRows();
    var cc=countAtt();
    el("cOk").textContent=fa(cc.p)+" حاضر"; el("cLate").textContent=fa(cc.l)+" تأخیر";
    el("cNo").textContent=fa(cc.a)+" غایب";
  }
  else if(a==="cancel-session"){
    toast("جلسه لغو شد. همه «نامربوط» ثبت شدند و به زبان‌آموزها پیامک رفت.");
    go("t");
  }
  else if(a==="submit-att"){
    var cnt=countAtt();
    var msg=cnt.a>0?"ثبت شد؛ به "+fa(cnt.a)+" زبان‌آموز پیامک غیبت رفت"
                   :"ثبت شد؛ همه حاضر بودند";
    var snap=JSON.parse(JSON.stringify(S.att));
    toast(msg,function(){S.att=snap;toast("ثبت برگردانده شد");});
    go("t");
  }
  else if(a==="open-sub"){modalSubmit(act.dataset.aid);}
  else if(a==="send-text"){
    closeModal(); S.subDraft="";
    toast("تکلیف ارسال شد. رسید تحویل برایتان پیامک شد.");
  }
  else if(a==="send-audio"){
    closeModal();
    toast("فایل صوتی ارسال شد ("+clock(S.rec.sec)+")");
  }
  else if(a==="g-next"||a==="g-save"){
    if(API.live){
      var subsL=DB.submissions.filter(function(x){return x.score==null;});
      if(a==="g-save"){
        var scRaw=enDigits(((el("gScore")||{}).value||"").trim());
        if(scRaw===""||isNaN(+scRaw)){toast("نمره را وارد کنید");return;}
        act("assignments.php",
          {action:"grade",id:act.dataset.id,score:scRaw,feedback:(el("fb")||{}).value||""},
          "نمره ثبت شد");
        return;
      }
      if(S.grade.idx<subsL.length-1){S.grade.idx++;render();}
      return;
    }
    var subsN=DB.submissions.filter(function(x){return x.aid==="a1";});
    if(a==="g-save"){
      var sidS=subsN[S.grade.idx].sid;
      if(rubTotal(sidS)==null){toast("همهٔ معیارهای روبریک را نمره بدهید");return;}
      S.grade.fb[sidS]=el("fb").value;
      toast("نمرهٔ "+esc(stu(sidS).name)+" ثبت شد");
    }
    if(S.grade.idx<subsN.length-1){S.grade.idx++;render();}
    else{toast("همهٔ تکالیف تصحیح شد. برای انتشار نمرات به دفتر نمره بروید.");go("t/gradebook");}
  }
  else if(a==="g-prev"){if(S.grade.idx>0){S.grade.idx--;render();}}
  else if(a==="publish-grades"){toast("نمرات منتشر شد و به زبان‌آموزها اطلاع داده شد.");}
  else if(a==="pay"){toast("در محصول واقعی، اینجا به درگاه پرداخت منتقل می‌شوید.");}
  else if(a==="upload-receipt"){toast("فیش آپلود شد و به صف تأیید مالی رفت.");}
  else if(a==="new-assignment"){toast("فرم ساخت تکلیف بر اساس نوع، در سند R تعریف شده است.");}
  else if(a==="go-teacher"){go("t");}
  else if(a==="open-student"){S.selStudentId=act.dataset.id;go("m/student");}
  else if(a==="ob-do"){
    var k=act.dataset.k;
    if(k==="term"){go("m/term");return;}
    if(k==="students"){go("m/enrol");return;}
    S.onboard[k]=true; render();
    toast(k==="team"?"دعوت‌نامه برای ۴ همکار ارسال شد"
        :k==="money"?"تنظیمات مالی و پنل پیامک ثبت شد":"انجام شد");
  }
  else if(a==="noop"){toast("این بخش در نمونهٔ تعاملی فعال نیست.");}

  /* ══════ کارهای واقعی: کلاس ══════ */
  else if(a==="cl-new"){modalClass("");}
  else if(a==="cl-edit"){modalClass(act.dataset.id);}
  else if(a==="cl-save"){
    var f=readClass();
    if(!f.name){toast("نام کلاس را وارد کنید");return;}
    if(!/^\d{1,2}:\d{2}$/.test(f.time)){toast("ساعت را مثل ۱۸:۰۰ وارد کنید");return;}
    if(f.mode!=="in_person"&&!f.joinUrl&&f.provider!=="bbb"&&f.provider!=="jitsi"){
      toast("کلاس آنلاین لینک جلسه می‌خواهد");return;}
    var id=act.dataset.id;
    if(id)f.id=id;
    f.action=id?"update":"create";
    closeModal();
    doAct("classes.php",f,id?"کلاس ذخیره شد":"کلاس ساخته شد");
  }
  else if(a==="cl-publish"){
    doAct("classes.php",{action:"publish",id:act.dataset.id},null,function(r){
      toast("منتشر شد؛ "+fa(r.sessions)+" جلسه ساخته شد");});
  }
  else if(a==="cl-people"){loadMembers(function(){modalPeople(act.dataset.id);});}
  else if(a==="cl-enrol"){
    var sid=(el("enrPick")||{}).value;
    if(!sid){toast("زبان‌آموز را انتخاب کنید");return;}
    var cid=act.dataset.cls;
    doAct("classes.php",{action:"enrol",classId:cid,studentId:sid},"ثبت‌نام شد",function(){
      modalPeople(cid);});
  }
  else if(a==="cl-withdraw"){
    var cid2=act.dataset.cls;
    doAct("classes.php",{action:"withdraw",classId:cid2,studentId:act.dataset.sid},
          "از کلاس حذف شد",function(){modalPeople(cid2);});
  }

  /* ══════ ترم ══════ */
  else if(a==="tm-setup"){modalTerm();}
  else if(a==="tm-save"){
    var tn=((el("tmName")||{}).value||"").trim();
    if(!tn){toast("نام ترم را وارد کنید");return;}
    var tmStart=dateVal("tmStart")||todayISO();
    var tmWeeks=+enDigits((el("tmWeeks")||{}).value)||12;
    closeModal();
    doAct("institute.php",{action:"setup",termName:tn,termStart:tmStart,weeks:tmWeeks,
      rooms:[{name:"کلاس ۱",cap:12},{name:"کلاس ۲",cap:16}]},"ترم ساخته شد");
  }

  /* ══════ ارسال پاسخ زبان‌آموز ══════ */
  else if(a==="sub-open"){modalAnswer(act.dataset.id);}
  else if(a==="sub-send"){
    var aid=act.dataset.id, txt=((el("ansText")||{}).value||"").trim();
    var fi=el("ansFile"), file=fi&&fi.files&&fi.files[0];
    if(!txt&&!file){toast("متن یا فایل پاسخ را بدهید");return;}
    if(!API.live){toast("در نسخهٔ نمایشی ذخیره نمی‌شود.");return;}
    var fd=new FormData();
    fd.append("action","submit"); fd.append("id",aid); fd.append("text",txt);
    if(file)fd.append("file",file);
    S.busy=true;
    fetch(API.base+"assignments.php",{method:"POST",body:fd,credentials:"same-origin"})
      .then(function(r){return r.json();})
      .then(function(r){
        S.busy=false;
        if(!r.ok){toast(r.message||"ارسال نشد");return;}
        closeModal();
        reload(function(){toast(r.late?"ارسال شد — با تأخیر":"پاسخ ارسال شد");});
      },function(){S.busy=false;toast("ارتباط با سرور برقرار نشد");});
  }

  /* ══════ اعضا و تنظیمات ══════ */
  else if(a==="mem-invite"){loadMembers(function(){modalInvite(act.dataset.role);});}
  else if(a==="mem-send"){
    var nm=((el("ivName")||{}).value||"").trim();
    var ph2=enDigits((el("ivPhone")||{}).value||"").replace(/\s/g,"");
    if(!nm){toast("نام را وارد کنید");return;}
    if(!/^09\d{9}$/.test(ph2)){toast("شمارهٔ موبایل باید ۱۱ رقم و با ۰۹ شروع شود");return;}
    /* همهٔ مقدارها را *قبل* از بستن مودال می‌خوانیم.
       closeModal مودال را خالی می‌کند و بعدش el(...) همیشه null است. */
    var ivCls=(el("ivClass")||{}).value||"";
    closeModal();
    doAct("institute.php",{action:"invite",fullName:nm,phone:ph2,role:act.dataset.role,
                           classId:ivCls},null,function(r){
      toast(r.message||"دعوت ثبت شد"); S.members=null; loadMembers();});
  }
  else if(a==="mem-remove"){
    doAct("institute.php",{action:"removeMember",id:act.dataset.id},"حذف شد",function(){
      S.members=null; loadMembers();});
  }
  else if(a==="mem-meeting"){
    var onFlag=act.dataset.on==="1";
    doAct("institute.php",{action:"setMeetingAccess",id:act.dataset.id,on:onFlag},
      onFlag?"اجازهٔ جلسهٔ میت داده شد":"اجازهٔ جلسهٔ میت گرفته شد",function(){
      S.members=null; loadMembers();});
  }
  else if(a==="st-save"){
    doAct("institute.php",{action:"update",name:((el("stName")||{}).value||"").trim(),
      city:(el("stCity")||{}).value||"",phone:(el("stPhone")||{}).value||""},"ذخیره شد");
  }
  else if(a==="room-new"){modalRoom();}
  else if(a==="room-save"){
    var rn=((el("rmName")||{}).value||"").trim();
    if(!rn){toast("نام را وارد کنید");return;}
    closeModal();
    doAct("institute.php",{action:"addRoom",name:rn,cap:+enDigits((el("rmCap")||{}).value)||12},"افزوده شد");
  }
  else if(a==="room-del"){doAct("institute.php",{action:"deleteRoom",id:act.dataset.id},"حذف شد");}

  /* ══════ جلسه ══════ */
  else if(a==="se-start"){
    var seId=act.dataset.id;
    doAct("sessions.php",{action:"start",id:seId},null,function(r){
      if(r.provider==="jitsi"&&r.joinUrl){openMeet(r.joinUrl,seId,true);}
      else if(r.joinUrl){window.open(r.joinUrl,"_blank","noopener");}
      toast(r.attendanceAuto?"کلاس شروع شد؛ حضور خودکار ثبت می‌شود"
                            :"کلاس شروع شد؛ حضور و غیاب را دستی بزنید");
    });
  }
  else if(a==="se-end"){doAct("sessions.php",{action:"end",id:act.dataset.id},"جلسه بسته شد");}
  else if(a==="se-join"){
    var joinId=act.dataset.id;
    apiCall("sessions.php",{action:"join",id:joinId}).then(function(r){
      if(!r.ok){toast(r.message||"ورود ممکن نشد");return;}
      if(r.provider==="jitsi")openMeet(r.joinUrl,joinId,false);
      else window.open(r.joinUrl,"_blank","noopener");
    });
  }
  else if(a==="meet-leave"){leaveMeet();}
  else if(a==="se-att"){openAttendance(act.dataset.id);}
  else if(a==="att-save"){
    var marks=Object.keys(S.attNow||{}).map(function(k){return {id:k,status:S.attNow[k]};});
    doAct("attendance.php",{action:"save",id:act.dataset.id,marks:marks},null,function(r){
      toast("حضور "+fa(r.saved)+" نفر ثبت شد");closeModal();});
  }

  /* ══════ تکلیف ══════ */
  else if(a==="ag-new"){modalAssignment(act.dataset.cls||"");}
  else if(a==="ag-save"){
    var t2=((el("agTitle")||{}).value||"").trim();
    if(!t2){toast("عنوان را وارد کنید");return;}
    var agv={classId:(el("agCls")||{}).value,type:(el("agType")||{}).value,
             desc:(el("agDesc")||{}).value||"",dueDate:dateVal("agDue"),
             max:+enDigits((el("agMax")||{}).value)||20};
    closeModal();
    doAct("assignments.php",{action:"create",title:t2,classId:agv.classId,type:agv.type,
      desc:agv.desc,dueDate:agv.dueDate,max:agv.max},"تکلیف ساخته شد");
  }
  else if(a==="ag-close"){doAct("assignments.php",{action:"close",id:act.dataset.id},"بسته شد");}
});

/* ــــ کمکی‌های کار واقعی ــــ */

function doAct(file,body,okMsg,then){
  if(!API.live){toast("این کار در نسخهٔ نمایشی ذخیره نمی‌شود.");return;}
  act(file,body,okMsg,then);
}

function loadMembers(then){
  if(S.members){if(then)then();return;}
  apiCall("institute.php",{action:"members"}).then(function(r){
    if(r&&r.ok)S.members=r;
    if(then)then();
  });
}

/* ══════════ تکلیف: کی داده، کی نداده ══════════
 *
 * تا امروز مدرس فقط صف تصحیح را می‌دید — یعنی کسانی که *داده‌اند*.
 * کسی که نداده هیچ‌جا دیده نمی‌شد، و همان‌ها هستند که باید یادآوری
 * شوند.
 */

function openAsgStatus(aid){
  apiCall("assignments.php",{action:"status",id:aid}).then(function(r){
    if(!r.ok){toast(r.message||"باز نشد");return;}
    S.asgStat=r;
    drawAsgStatus();
  });
}

function drawAsgStatus(){
  var d=S.asgStat, a=d.assignment;
  var missing=d.students.filter(function(s){return !s.submitted;});

  openModal(h`
    <div class="modal-h"><h3>${esc(a.title)}</h3>
      <button class="ib x" data-act="close" aria-label="بستن">✕</button></div>
    <div class="modal-b">
      <div class="asg-sum">
        <span><b class="num">${fa(d.submitted)}</b> تحویل داده</span>
        <span class="${missing.length?"down":""}"><b class="num">${fa(d.missing)}</b> نداده</span>
      </div>

      ${a.dueAt?h`<p class="muted" style="font-size:13px;line-height:1.9">
        مهلت: <span class="num">${jDateTime(a.dueAt)}</span>
        ${a.extendedTo?h`<br>تمدید تا <b class="num">${jDateTime(a.extendedTo)}</b>${
          a.extendNote?h` — ${esc(a.extendNote)}`:""}`:""}</p>`
       :h`<p class="muted" style="font-size:13px">این تکلیف مهلت ندارد.</p>`}

      ${a.dueAt?h`
      <div class="fld" style="margin-top:12px">
        <label for="exDate">${a.extendedTo?"تغییر تمدید":"تمدید مهلت"}</label>
        <input id="exDate" class="jdate" type="text" readonly autocomplete="off"
               data-iso="${esc(a.extendedTo?String(a.extendedTo).slice(0,10):"")}"
               value="${a.extendedTo?jFull(String(a.extendedTo).slice(0,10)):""}"
               placeholder="تاریخ تازه را انتخاب کنید">
      </div>
      <div class="fld">
        <label for="exNote">چرا؟</label>
        <input id="exNote" type="text" maxlength="255" value="${esc(a.extendNote||"")}"
               placeholder="مثلاً: قطعی سامانه در شب مهلت">
        <span class="hint">در پروندهٔ تکلیف می‌ماند و بعداً معلوم است چرا تمدید شده.</span>
      </div>
      <div class="r" style="gap:8px;margin-block:2px 14px">
        <button class="btn btn--p btn--sm" data-act="asg-extend" data-id="${esc(a.id)}">
          ثبت تمدید</button>
        ${a.extendedTo?h`<button class="btn btn--g btn--sm" data-act="asg-unextend"
          data-id="${esc(a.id)}">برداشتن تمدید</button>`:""}
      </div>`:""}

      <div class="asg-people">${d.students.map(function(s){
        return h`<div class="rrow" data-st="${s.submitted?"":"absent"}">
          <span class="av">${initials(s.name)}</span>
          <span class="nm"><span>${esc(s.name)}</span>
            <small>${s.submitted
              ? jDateTime(s.at)+(s.late?" · با تأخیر":"")+(s.hasFile?" · فایل":"")
              : "هنوز تحویل نداده"}</small></span>
          <span class="rt">${s.submitted
            ? (s.graded?pill(fa(s.score)+" از "+fa(a.max),"ok")
                       :pill("منتظر تصحیح","warn"))
            : pill("نداده","mute")}</span>
        </div>`;}).join("")}</div>
    </div>
    <div class="modal-f">
      ${missing.length&&navVisible({perm:"notify.send"})?h`
        <button class="btn btn--g" data-act="asg-remind">یادآوری به ${fa(missing.length)} نفر</button>`:""}
      <button class="btn btn--p" data-act="close">بستن</button>
    </div>`,true);
}

function openAttendance(sessionId){
  apiCall("attendance.php",{action:"get",id:sessionId}).then(function(r){
    if(!r.ok){toast(r.message||"باز نشد");return;}
    S.attNow={};
    r.roster.forEach(function(s){S.attNow[s.id]=s.status;});
    S.attSession=r;
    drawAttendance(sessionId);
  });
}

function drawAttendance(sessionId){
  var r=S.attSession, absent=0;
  Object.keys(S.attNow).forEach(function(k){if(S.attNow[k]==="absent")absent++;});
  openModal(h`
    <div class="modal-h"><h3>حضور و غیاب — جلسهٔ ${fa(r.session.seq)}</h3>
      <button class="ib x" data-act="close" aria-label="بستن">✕</button></div>
    <div class="modal-b">
      <p class="muted">${esc(r.className)} · ${jDay(r.session.date)}</p>
      <p style="font-size:13.5px">همه پیش‌فرض حاضرند. فقط غایب‌ها را بزنید.
         ${absent>0?h`<b class="num">${fa(absent)} غایب</b>`:""}</p>
      ${(function(){
        /* کسانی که به مرز افتادن رسیده‌اند، بالای فهرست خلاصه می‌شوند —
           وگرنه در کلاس بیست‌نفره باید دنبال عددهای کوچک بگردی */
        var risky=r.roster.filter(function(x){return x.absences>=3;});
        return risky.length?h`<div class="su-note" style="margin-block:4px 12px">
          <b>${risky.map(function(x){return esc(x.name)+" ("+fa(x.absences)+")";}).join("، ")}</b>
          — سه غیبت یا بیشتر.</div>`:"";
      })()}
      ${r.roster.length===0?'<div class="empty"><b>کسی در این کلاس ثبت‌نام نیست</b></div>'
      :h`<div>${r.roster.map(function(s){
        var st=S.attNow[s.id];
        /*
         * شمار غیبت کنار نام، نه در گزارش پایان ترم.
         *
         * مدرس درست همان لحظه‌ای که دارد «غایب» می‌زند باید بداند این
         * چندمین بار است. سه غیبت یعنی زبان‌آموز دارد از کلاس می‌افتد
         * و هنوز می‌شود کاری کرد؛ همان عدد در گزارش پایان ترم فقط
         * توضیح می‌دهد چرا افتاده.
         */
        var warn=s.absences>=3?"bad":s.absences>0?"warn":"";
        /*
         * .rrow، نه .att-row.
         *
         * نمای زنده از .att-row استفاده می‌کرد که هیچ‌جای شیوه‌نامه
         * تعریف نشده — یعنی ردیف‌ها بدون فاصله و بدون خط جداکننده روی
         * هم می‌افتادند، و data-st هم اثری نداشت. نمای نمایشی از روز
         * اول .rrow داشت؛ حالا هر دو یکی‌اند.
         */
        return h`<div class="rrow" data-st="${st==="absent"?"absent":""}">
          <span class="av">${initials(s.name)}</span>
          <span class="nm"><span>${esc(s.name)}</span>
            ${s.absences?h`<small class="abs ${warn}">${fa(s.absences)} غیبت${
                 s.lates?h` · ${fa(s.lates)} تأخیر`:""}</small>`
             :s.lates?h`<small class="abs warn">${fa(s.lates)} تأخیر</small>`
             :""}</span>
          <span class="seg" role="group" aria-label="وضعیت ${esc(s.name)}">
            ${[["present","حاضر"],["late","تأخیر"],["absent","غایب"],["excused","موجه"]].map(function(o){
              return '<button class="'+(st===o[0]?"on "+o[0]:"")+'" data-att="'+s.id+'" data-v="'+o[0]+'">'+o[1]+'</button>';
            }).join("")}
          </span></div>`;}).join("")}</div>`}
    </div>
    <div class="modal-f">
      <button class="btn btn--g" data-act="close">انصراف</button>
      <button class="btn btn--p" data-act="att-save" data-id="${sessionId}">ثبت</button>
    </div>`,true);
}

 */

document.addEventListener("input",function(e){
  if(e.target.id==="subText"){wordCount();return;}

  /*
   * جست‌وجوی آموزشگاه، با مکث.
   *
   * بدون مکث، هر نویسه یک درخواست می‌فرستد: نوشتن «پردیس» شش درخواست
   * می‌شود که پنج‌تایش پیش از رسیدن بی‌ارزش شده. ۳۰۰ میلی‌ثانیه کوتاه‌تر
   * از آن است که کاربر مکث را حس کند و بلندتر از آنکه بین دو نویسه
   * جا شود.
   *
   * ترتیب پاسخ‌ها هم تضمین نیست: درخواست «پر» ممکن است بعد از «پردیس»
   * برسد و فهرست را عقب ببرد. برای همین پاسخ فقط وقتی نشانده می‌شود
   * که متنِ همان لحظه هنوز همان باشد.
   */
  if(e.target.dataset&&e.target.dataset.suq){
    S.su.instQ=e.target.value;
    if(S.su.searchTimer)clearTimeout(S.su.searchTimer);
    var q=e.target.value.trim();
    if(q.length<2){S.su.insts=null;S.su.searchTimer=null;return;}
    S.su.searchTimer=setTimeout(function(){
      S.su.searchTimer=null;
      apiCall("signup.php",{action:"institutes",q:q}).then(function(r){
        if((S.su.instQ||"").trim()!==q)return;
        S.su.insts=(r&&r.ok)?(r.institutes||[]):[];
        render();
        var again=el("suInstQ");
        if(again){again.focus();again.setSelectionRange(again.value.length,again.value.length);}
      });
    },300);
    return;
  }
  /* زیر تقویم‌گزین، روز هفته نوشته می‌شود — الگوی فرد/زوج به آن نیاز دارد */
  if(e.target.id==="agDue"){var n=el("agDueFa"); if(n)n.textContent=jDay(e.target.dataset.iso||"");return;}
  if(e.target.id==="tmStart"){var n2=el("tmStartFa"); if(n2)n2.textContent=jDay(e.target.dataset.iso||"");return;}

  /* کد یک‌بارمصرف: رقم که خورد، خودکار برو خانهٔ بعد */
  if(e.target.dataset&&e.target.dataset.otp!=null){
    var digits=enDigits(e.target.value).replace(/\D/g,"");
    /*
     * بیشتر از یک رقم یعنی یا کاربر کد را چسبانده، یا گوشی خودش
     * پرش کرده. از همین خانه به بعد پخشش می‌کنیم.
     */
    if(digits.length>1){ spreadOtp(+e.target.dataset.otp,digits); return; }
    e.target.value=digits;
    e.target.classList.toggle("filled",!!digits);
    var inputs=el("otpBox").querySelectorAll("input");
    var i=+e.target.dataset.otp;
    if(digits&&i<inputs.length-1)inputs[i+1].focus();
    otpReady();
    /*
     * آخرین رقم که خورد، خودش تأیید می‌شود — همان‌طور که چسباندن کد
     * کامل تأیید می‌شود. رسیدن به رقم پنجم یعنی کاربر کارش تمام است و
     * فشاردادن یک دکمهٔ اضافه چیزی به تصمیمش اضافه نمی‌کند.
     */
    if(digits&&i===inputs.length-1&&otpValue().length===inputs.length){
      var vb=el("auVerify");
      if(vb&&!vb.disabled&&!S.auth.busy)vb.click();
    }
    return;
  }

  /* ویرایش ردیف ترم‌ساز → تداخل زنده بازمحاسبه می‌شود */
  var f=e.target.dataset&&e.target.dataset.f;
  if(f&&e.target.dataset.id){
    var id=+e.target.dataset.id;
    S.term.rows.forEach(function(r){
      if(r.id===id)r[f]=(f==="cap")?(+e.target.value||0):e.target.value;});
    render();
    var again=document.querySelector('[data-f="'+f+'"][data-id="'+id+'"]');
    if(again)again.focus();
  }
});

    var id=+e.target.dataset.id;
    S.term.rows.forEach(function(r){

/* ── کد یک‌بارمصرف: چسباندن، تکمیل خودکار، و پرکردن از پیامک ── */

/** رقم‌ها را از خانهٔ start به بعد پخش می‌کند و اگر کامل شد، خودش تأیید را می‌زند */
function spreadOtp(start,digits){
  var box=el("otpBox"); if(!box)return;
  var inputs=box.querySelectorAll("input");
  /*
   * اگر رشته دقیقاً به اندازهٔ کل خانه‌هاست، از اول می‌نشیند حتی اگر
   * فوکوس وسط بوده. کسی که کد پنج‌رقمی را در خانهٔ سوم می‌چسباند،
   * منظورش کل کد است نه دو رقم آخرش.
   */
  if(digits.length>=inputs.length)start=0;
  for(var k=0;k<inputs.length-start;k++){
    var d=digits.charAt(k);
    inputs[start+k].value=d;
    inputs[start+k].classList.toggle("filled",!!d);
  }
  var last=Math.min(start+digits.length,inputs.length)-1;
  if(inputs[last])inputs[last].focus();
  otpReady();

  /* کد کامل است و چیزی برای تصمیم‌گیری نمانده — منتظر کلیک نمی‌مانیم */
  if(otpValue().length===inputs.length){
    var v=el("auVerify");
    if(v&&!v.disabled&&!S.auth.busy)v.click();
  }
}

/** نام، آموزشگاه و نام کاربری را از فرم به S منتقل می‌کند */
function readProfileFields(){
  var n=el("auName2"), i=el("auInst2"), u=el("auUser2");
  if(n)S.auth.name=n.value.trim();
  if(i)S.auth.inst=i.value.trim();
  if(u)S.auth.user=u.value.trim().toLowerCase();
  /*
   * رمز هم نگه داشته می‌شود.
   *
   * وقتی «این نام کاربری گرفته شده» می‌گیرد، صفحه دوباره ساخته می‌شود.
   * اگر رمز را نگه نداریم، کاربر فقط نام کاربری را عوض می‌کند و دکمه
   * را می‌زند و این بار «رمز باید حداقل ۸ نویسه باشد» می‌گیرد — بدون
   * اینکه بفهمد چه شد. رمز در همان صفحه و همان حافظه می‌ماند و با
   * ساخته‌شدن حساب پاک می‌شود.
   */
  var a1=el("auPass1"), a2=el("auPass2");
  if(a1)S.auth.p1=a1.value;
  if(a2)S.auth.p2=a2.value;
}

/** رمزها را از حافظه پاک می‌کند — بعد از ساخت حساب یا خروج از این صفحه */
function clearAuthSecrets(){
  S.auth.p1=""; S.auth.p2=""; S.auth.newPass="";
}

function otpValue(){
  var box=el("otpBox"); if(!box)return "";
  var s="";
  Array.prototype.forEach.call(box.querySelectorAll("input"),function(x){s+=x.value;});
  return enDigits(s).replace(/\D/g,"");
}

function otpReady(){
  var box=el("otpBox"); if(!box)return;
  var all=Array.prototype.every.call(box.querySelectorAll("input"),function(x){return x.value;});
  var v=el("auVerify"); if(v)v.disabled=!all;
}

/*
 * چسباندن را جدا هم می‌گیریم.
 *
 * رویداد input در بیشتر مرورگرها بعد از paste هم می‌آید و همان راه
 * کافی است، ولی وقتی کاربر رشته‌ای با فاصله یا ارقام فارسی می‌چسباند
 * («۱۲ ۳۴۵» از یک پیامک)، اینجا تمیزش می‌کنیم و جلوی رفتار پیش‌فرض را
 * می‌گیریم تا در خانه ننشیند.
 */
document.addEventListener("paste",function(e){
  if(!e.target.dataset||e.target.dataset.otp==null)return;
  var txt=(e.clipboardData||window.clipboardData);
  if(!txt)return;
  var digits=enDigits(String(txt.getData("text")||"")).replace(/\D/g,"");
  if(!digits)return;
  e.preventDefault();
  spreadOtp(+e.target.dataset.otp,digits);
});

/*
 * پرکردن خودکار از پیامک روی اندروید (WebOTP).
 *
 * روی iOS بدون هیچ کدی کار می‌کند: سیستم کد را در نوار پیشنهاد بالای
 * صفحه‌کلید نشان می‌دهد و با یک لمس در خانه می‌نشیند — به شرطی که
 * autocomplete="one-time-code" روی input باشد، که هست.
 *
 * روی اندروید کروم این API لازم است، و فقط وقتی جواب می‌دهد که آخرین
 * خط پیامک دقیقاً «@دامنه #کد» باشد. اگر قالب پیامک این خط را نداشته
 * باشد هیچ اتفاقی نمی‌افتد و هیچ خطایی هم نمی‌دهد — یعنی گذاشتنش
 * بی‌ضرر است حتی اگر قالب هنوز به‌روز نشده باشد.
 */
var otpAbort=null;
function watchSmsCode(){
  if(!("OTPCredential" in window)||!navigator.credentials)return;
  stopSmsWatch();
  otpAbort=new AbortController();
  navigator.credentials.get({otp:{transport:["sms"]},signal:otpAbort.signal})
    .then(function(c){
      if(!c||!c.code)return;
      var d=enDigits(String(c.code)).replace(/\D/g,"");
      if(d)spreadOtp(0,d);
    })
    .catch(function(){ /* لغو یا رد کاربر — نه خطاست نه چیزی برای نمایش */ });
}
function stopSmsWatch(){
  if(otpAbort){try{otpAbort.abort();}catch(e){} otpAbort=null;}
}

/*
 * Enter در صفحهٔ ورود همان دکمهٔ اصلی همان مرحله را می‌زند.
 * بدون این، کاربر روی موبایل بعد از تایپ رمز دنبال دکمه می‌گردد و
 * روی دسکتاپ Enter هیچ کاری نمی‌کند — هر دو حس خرابی می‌دهند.
 */
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||S.route!=="auth"||e.target.tagName!=="INPUT")return;
  if(e.target.dataset&&e.target.dataset.otp!=null)return;   /* خانه‌های کد خودشان تأیید می‌کنند */
  var order=["au-login","au-send","au-reset","au-profile"];
  for(var i=0;i<order.length;i++){
    var btn=document.querySelector('[data-act="'+order[i]+'"]');
    if(btn&&!btn.disabled){e.preventDefault();btn.click();return;}
  }
});

el("burg").addEventListener("click",function(){

/* ══════════ بالا آمدن ══════════ */
function finishBoot(){
  el("root").classList.toggle("is-live",API.live);
  render();
  /*
   * اعلان‌ها یک‌بار حالا و بعد هر دو دقیقه.
   *
   * نه کمتر: اعلانِ کلاسِ فردا، دو دقیقه دیرتر هم به‌موقع است، و هر
   * درخواست اضافه روی هاست اشتراکی هزینه دارد. نه بیشتر: کسی که پنل
   * را باز گذاشته، نباید خبر لغو کلاس امروز را نیم‌ساعت دیر بفهمد.
   */
  if(API.live&&API.user){
    notifLoad();
    if(!S.notif.timer)S.notif.timer=setInterval(notifLoad,120000);
  }
  var b=el("boot");
  if(b){b.classList.add("off");setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},400);}
}
function startDemo(){API.live=false;finishBoot();}

function boot(){
  /* ثبت‌نام حالا صفحهٔ خودش را دارد؛ نیتی نمانده که نگه داشته شود */
  var wantsSignup=/^#\/?signup/.test(location.hash||"");
  if(!window.fetch||!window.Promise){startDemo();return;}
  withTimeout(apiCall("health.php"),4000).then(function(hl){
    if(!hl||!hl.ok||!hl.database){startDemo();return;}
    API.live=true;
    /* "bridge" یعنی کد ورود پیامک نمی‌شود؛ صفحهٔ ورود نباید وعدهٔ پیامک بدهد */
    API.bridge=(hl.sms==="bridge");
    return withTimeout(apiCall("me.php"),4000).then(function(m){
      if(!m||!m.ok||!m.authenticated){
        API.user=null;
        location.hash=wantsSignup?"#/signup":"#/auth";
        finishBoot();
        return;
      }
      applyUser(m.user);
      // دادهٔ واقعی؛ اگر کاربر عضو هیچ آموزشگاهی نباشد سرور no_institute می‌دهد
      return withTimeout(apiCall("bootstrap.php"),8000).then(function(b){
        if(b&&b.ok){applyBootstrap(b);}
        else if(b&&b.error==="no_institute"){API.noWorkspace=true;}
        else if(b&&b.error==="institute_suspended"){API.suspended=true;API.suspendedReason=b.message||API.suspendedReason;}
        else if(b){toast(b.message||"دریافت داده ناموفق بود");}

        var want=API.suspended?"susp":API.noWorkspace?"nows":roleRoute(m.user.role);
        var r=location.hash.replace(/^#\/?/,"");
        /*
         * مسیرهای مشترک بین نقش‌ها از این بازنویسی مستثنا هستند.
         *
         * قاعدهٔ «پیشوند مسیر باید با نقش بخواند» برای m/… و t/… و s/…
         * درست است، ولی «compose» پیشوند نقشی ندارد و به هر دو نقش
         * تعلق دارد. بدون این استثنا، تازه‌کردن صفحه یا نشان‌کردنش
         * کاربر را به داشبورد پرت می‌کرد و نوشتهٔ نیمه‌کاره‌اش می‌رفت.
         */
        var shared=(r==="compose");
        if(!shared&&(!r||r==="auth"||r==="nows"||r==="susp"||r.split("/")[0]!==want)){
          location.hash="#/"+want;
        }
        finishBoot();
      });
    });
  },startDemo);
}
boot();
})();
