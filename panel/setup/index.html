<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>نصب تاکورا</title>
<style>
@font-face{font-family:"Dana";src:url("../fonts/dana-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Dana";src:url("../fonts/dana-bold.woff2") format("woff2");font-weight:700;font-display:swap}

/*
 * --on-brand رنگ متنی است که روی خود --brand می‌نشیند. جدا نگه داشتنش
 * لازم است چون در حالت روشن، برند سبز عمیق است و متن سفید می‌خواهد؛
 * در حالت تیره برند سبز پاستیلی می‌شود و متن سفید رویش خوانده نمی‌شود
 * (نسبت ۱.۵) و باید تیره شود. با توکن، دکمه فقط یک قاعده دارد.
 */
:root{
  --paper:#F7F3E8; --surface:#FCFAF3; --surface-2:#F1EBDC;
  --ink:#24352F; --ink-2:#4A5B54; --ink-3:#71827A;
  --line:#DDE5DC; --brand:#3F7D68; --brand-2:#2C5A4A; --brand-soft:#C9EDE1;
  --on-brand:#FCFAF3;
  --ok:#2E7D5B; --ok-soft:#DCF0E6; --warn:#8A6520; --warn-soft:#F6EBD5;
  --bad:#A8452F; --bad-soft:#F4E2DD; --ring:rgba(63,125,104,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131A17; --surface:#1B2420; --surface-2:#222D28;
  --ink:#ECF2EE; --ink-2:#BFCCC5; --ink-3:#8E9E96;
  --line:#2B3832; --brand:#A9DDC9; --brand-2:#C9EDE1; --brand-soft:#1E322A;
  --on-brand:#131A17;
  --ok:#6FCFA6; --ok-soft:#163024; --warn:#E8C98F; --warn-soft:#2E2718;
  --bad:#E08A75; --bad-soft:#33201B; --ring:rgba(169,221,201,.32);
}}
:root[data-theme="dark"]{
  --paper:#131A17; --surface:#1B2420; --surface-2:#222D28;
  --ink:#ECF2EE; --ink-2:#BFCCC5; --ink-3:#8E9E96;
  --line:#2B3832; --brand:#A9DDC9; --brand-2:#C9EDE1; --brand-soft:#1E322A;
  --on-brand:#131A17;
  --ok:#6FCFA6; --ok-soft:#163024; --warn:#E8C98F; --warn-soft:#2E2718;
  --bad:#E08A75; --bad-soft:#33201B; --ring:rgba(169,221,201,.32);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Dana",system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--paper);color:var(--ink);
  line-height:1.75;font-size:15px;padding:26px 16px 70px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-inline-size:760px;margin-inline:auto}
.head{display:flex;align-items:center;gap:12px;margin-block-end:22px}
.mark{inline-size:42px;block-size:42px;border-radius:12px;background:var(--brand);color:var(--on-brand);
  display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.head h1{font-size:20px;line-height:1.4}
.head p{font-size:13px;color:var(--ink-3)}

.steps{display:flex;gap:6px;margin-block-end:20px;flex-wrap:wrap}
.steps i{flex:1 1 60px;block-size:5px;border-radius:100px;background:var(--line)}
.steps i.on{background:var(--brand)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  margin-block-end:18px}
.card-h{padding:15px 20px;border-block-end:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:16px}
.card-b{padding:20px}

.fld{margin-block-end:15px}
.fld label{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-block-end:6px}
.fld input{inline-size:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface-2);color:var(--ink);font:inherit;font-size:15px}
.fld input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring);background:var(--surface)}
.fld .hint{display:block;font-size:12.5px;color:var(--ink-3);margin-block-start:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}

.btn{font:inherit;font-weight:700;font-size:14.5px;padding:11px 20px;border-radius:11px;
  border:1px solid transparent;cursor:pointer;background:var(--surface-2);color:var(--ink);
  display:inline-flex;align-items:center;gap:7px}
.btn:disabled{opacity:.55;cursor:default}
.btn--p{background:var(--brand);color:var(--on-brand)}
.btn--p:hover:not(:disabled){background:var(--brand-2)}
.btn--g{border-color:var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.chk{display:flex;gap:11px;padding:11px 0;border-block-end:1px solid var(--line);align-items:flex-start}
.chk:last-child{border-block-end:0}
.chk .dot{inline-size:22px;block-size:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:700;margin-block-start:2px}
.dot.ok{background:var(--ok-soft);color:var(--ok)}
.dot.warn{background:var(--warn-soft);color:var(--warn)}
.dot.bad{background:var(--bad-soft);color:var(--bad)}
.chk b{display:block;font-size:14px}
.chk span{font-size:13px;color:var(--ink-3)}

.note{padding:13px 16px;border-radius:12px;font-size:13.5px;margin-block-end:16px}
.note--i{background:var(--brand-soft);color:var(--ink-2);border:1px solid var(--line)}
.note--w{background:var(--warn-soft);color:var(--warn);border:1px solid currentColor}
.note--e{background:var(--bad-soft);color:var(--bad);border:1px solid currentColor}
.note--ok{background:var(--ok-soft);color:var(--ok);border:1px solid currentColor}
.note b{font-weight:700}

code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);
  padding:2px 6px;border-radius:6px;font-size:13px;direction:ltr;display:inline-block}
ol.next{padding-inline-start:20px;font-size:14px}
ol.next li{margin-block-end:9px}
a{color:var(--brand-2)}
.mut{color:var(--ink-3);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="mark">ا</div>
    <div><h1>نصب تاکورا</h1><p>یک بار انجام می‌شود و بعد این پوشه را پاک می‌کنید.</p></div>
  </div>
  <div class="steps" id="steps"></div>
  <div id="app"><div class="card"><div class="card-b mut">در حال بررسی سرور…</div></div></div>
</div>

<script>
(function(){
"use strict";

var FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function fa(n){return String(n).replace(/[0-9]/g,function(d){return FA[+d];});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}
function h(strings){var out=strings[0];
  for(var i=1;i<arguments.length;i++){out+=arguments[i]+strings[i];} return out;}

/*
 * مقدارهای فرم در S زندگی می‌کنند، نه در DOM.
 *
 * هر render صفحه را از نو می‌سازد. اگر مقدارها فقط در input بودند،
 * اولین خطای اتصال — یعنی همان لحظه‌ای که کاربر بیشتر از همیشه به
 * نوشته‌هایش نیاز دارد — پاکشان می‌کرد و باید رمز دیتابیس را دوباره
 * تایپ می‌کرد.
 */
var S={step:1,busy:false,err:"",probe:null,dbInfo:null,done:null,installed:false,
  db:{host:"localhost",name:"",user:"",pass:""},
  ad:{user:"",name:"",pass:"",pass2:"",email:"",phone:""}};

function call(body){
  return fetch("../api/install.php",{
    method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(j){return j;},function(){
      /*
       * پاسخ غیر JSON تقریباً همیشه یعنی PHP اصلاً اجرا نشده و متن خام
       * فایل برگشته، یا صفحهٔ خطای خود پلسک. گفتنِ «پاسخ خوانده نشد»
       * کمکی نمی‌کند؛ می‌گوییم کجا را نگاه کند.
       */
      return {ok:false,error:"bad_response",
        message:"سرور پاسخ درستی نداد. یعنی PHP روی این دامنه اجرا نمی‌شود — در پلسک نسخهٔ PHP را روی ۸ بگذارید."};});
  },function(){
    return {ok:false,error:"offline",message:"به api/install.php نرسیدم. کل بستهٔ پنل را در httpdocs آپلود کرده‌اید؟"};
  });
}

function steps(){
  el("steps").innerHTML=[1,2,3,4].map(function(i){
    return '<i class="'+(S.step>=i?"on":"")+'"></i>';}).join("");
}

/* ── ۱: بررسی سرور ── */
function viewProbe(){
  var p=S.probe;
  if(!p)return '<div class="card"><div class="card-b mut">در حال بررسی سرور…</div></div>';
  return h`
  <div class="card">
    <div class="card-h"><h2>۱ — سرور چه چیزهایی دارد</h2></div>
    <div class="card-b">
      ${p.checks.map(function(c){
        var st=c.pass?"ok":(c.fatal?"bad":"warn");
        return h`<div class="chk">
          <div class="dot ${st}">${c.pass?"✓":(c.fatal?"×":"!")}</div>
          <div><b>${esc(c.title)}</b><span>${esc(c.detail)}</span></div></div>`;}).join("")}
    </div>
    <div class="card-b" style="border-block-start:1px solid var(--line)">
      ${p.ready
        ? '<button class="btn btn--p" data-a="go2">ادامه — اتصال به پایگاه داده</button>'
        : '<div class="note note--e" style="margin:0">موردهای قرمز باید در پلسک درست شوند، وگرنه نصب نیمه‌کاره می‌ماند. '+
          'بعد از اصلاح، این صفحه را دوباره بارگذاری کنید.</div>'}
    </div>
  </div>`;
}

/* ── ۲: پایگاه داده ── */
function viewDb(){
  return h`
  <div class="note note--i">
    در پلسک به <b>Databases</b> بروید. اگر هنوز پایگاه داده نساخته‌اید،
    <b>Add Database</b> بزنید و یک کاربر هم برایش بسازید.
    بعد چهار مقدار زیر را <b>دقیقاً همان‌طور که در آن صفحه می‌بینید</b> اینجا بگذارید —
    پلسک معمولاً به نامی که تایپ کرده‌اید پیشوند اضافه می‌کند و همین رایج‌ترین دلیل
    «اتصال برقرار نشد» است.
  </div>
  <div class="card">
    <div class="card-h"><h2>۲ — پایگاه داده</h2></div>
    <div class="card-b">
      <div class="g2">
        <div class="fld"><label for="dbHost">میزبان</label>
          <input id="dbHost" data-f="db.host" dir="ltr" style="text-align:end" value="${esc(S.db.host)}">
          <span class="hint">معمولاً همین است</span></div>
        <div class="fld"><label for="dbName">نام پایگاه داده</label>
          <input id="dbName" data-f="db.name" dir="ltr" style="text-align:end" placeholder="talkora"
                 autocapitalize="off" spellcheck="false" value="${esc(S.db.name)}"></div>
      </div>
      <div class="g2">
        <div class="fld"><label for="dbUser">نام کاربری</label>
          <input id="dbUser" data-f="db.user" dir="ltr" style="text-align:end" autocomplete="off"
                 autocapitalize="off" spellcheck="false" value="${esc(S.db.user)}"></div>
        <div class="fld"><label for="dbPass">رمز عبور</label>
          <input id="dbPass" data-f="db.pass" type="password" dir="ltr" style="text-align:end"
                 autocomplete="off" value="${esc(S.db.pass)}"></div>
      </div>
      ${S.err?h`<div class="note note--e">${esc(S.err)}</div>`:""}
      ${S.dbInfo?h`<div class="note note--ok">${esc(S.dbInfo.message)}
        <br><span class="mut">MySQL ${esc(S.dbInfo.version)}</span></div>`:""}
      <div class="row">
        <button class="btn btn--g" data-a="test" ${S.busy?"disabled":""}>
          ${S.busy?"در حال بررسی…":"آزمایش اتصال"}</button>
        ${S.dbInfo?'<button class="btn btn--p" data-a="go3">ادامه — حساب مدیر</button>':""}
      </div>
    </div>
  </div>`;
}

/* ── ۳: حساب مدیر ── */
function viewAdmin(){
  return h`
  <div class="note note--i">
    این حساب برای <b>پنل سوپرادمین پلتفرم</b> است — جایی که آموزشگاه‌ها، نقش کاربرها،
    قیمت‌ها، متن‌های سایت و ایمیل مقصد را عوض می‌کنید. ربطی به حساب آموزشگاه‌ها ندارد؛
    آن‌ها با پیامک وارد می‌شوند. این پنل روی زیردامنهٔ جدای <code>admin.talkora.ir</code>
    بالا می‌آید — بستهٔ جداگانه‌ای دارد (talkora-admin.zip) که بعد از این نصب‌کننده
    طبق راهنمای خودش آپلود می‌کنید؛ همین‌جا فقط حساب کاربری‌اش ساخته می‌شود.
  </div>
  <div class="card">
    <div class="card-h"><h2>۳ — حساب مدیر</h2></div>
    <div class="card-b">
      <div class="g2">
        <div class="fld"><label for="adUser">نام کاربری</label>
          <input id="adUser" data-f="ad.user" dir="ltr" style="text-align:end" placeholder="admin"
                 autocapitalize="off" spellcheck="false" autocomplete="username" value="${esc(S.ad.user)}">
          <span class="hint">حروف انگلیسی کوچک و رقم</span></div>
        <div class="fld"><label for="adName">نام شما</label>
          <input id="adName" data-f="ad.name" placeholder="اختیاری" value="${esc(S.ad.name)}"></div>
      </div>
      <div class="g2">
        <div class="fld"><label for="adPass">رمز عبور</label>
          <input id="adPass" data-f="ad.pass" type="password" dir="ltr" style="text-align:end"
                 autocomplete="new-password" value="${esc(S.ad.pass)}">
          <span class="hint">حداقل ۱۰ نویسه. بازیابی خودکار ندارد — جایی امن نگهش دارید.</span></div>
        <div class="fld"><label for="adPass2">تکرار رمز</label>
          <input id="adPass2" data-f="ad.pass2" type="password" dir="ltr" style="text-align:end"
                 autocomplete="new-password" value="${esc(S.ad.pass2)}"></div>
      </div>
      <div class="g2">
        <div class="fld"><label for="adEmail">ایمیل دریافت درخواست دمو</label>
          <input id="adEmail" data-f="ad.email" type="email" dir="ltr" style="text-align:end"
                 placeholder="info@talkora.ir" value="${esc(S.ad.email)}">
          <span class="hint">بعداً از پنل سوپرادمین قابل تغییر است</span></div>
        <div class="fld"><label for="adPhone">تلفن نمایشی سایت</label>
          <input id="adPhone" data-f="ad.phone" type="tel" dir="ltr" style="text-align:end"
                 placeholder="اختیاری" value="${esc(S.ad.phone)}"></div>
      </div>
      ${S.err?h`<div class="note note--e">${esc(S.err)}</div>`:""}
      <div class="row">
        <button class="btn btn--p" data-a="install" ${S.busy?"disabled":""}>
          ${S.busy?"در حال نصب…":"نصب کن"}</button>
        <span class="mut">جدول‌ها ساخته می‌شوند و فایل پیکربندی نوشته می‌شود.</span>
      </div>
    </div>
  </div>`;
}

/* ── ۴: پایان ── */
function viewDone(){
  var d=S.done;
  return h`
  <div class="note note--ok"><b>نصب تمام شد.</b>
    ${fa(d.statements)} جدول ساخته شد و فایل پیکربندی
    ${d.outside?"<b>بیرون از پوشهٔ وب</b> نوشته شد — امن‌ترین حالت."
               :"کنار پوشهٔ api نوشته شد."}</div>

  <div class="card">
    <div class="card-h"><h2>حالا این چهار کار</h2></div>
    <div class="card-b">
      <ol class="next">
        <li><b>پوشهٔ <code>setup</code> را پاک کنید.</b>
          در پلسک → File Manager، همین پوشه‌ای که این صفحه از آن باز شده.
          نصب‌کننده از حالا هر درخواستی را رد می‌کند، ولی نگه‌داشتنش دلیلی ندارد.</li>
        <li><b>بستهٔ پنل سوپرادمین را هم بالا بیاورید</b> — talkora-admin.zip را طبق
          راهنمای خودش روی زیردامنهٔ <a href="https://admin.talkora.ir/" target="_blank" rel="noopener">admin.talkora.ir</a>
          بریزید، بعد با ${d.username?h`نام کاربری <code>${esc(d.username)}</code>`:"همان حسابی که از قبل ساخته بودید"}
          وارد شوید. جدول‌ها همین الان ساخته شدند؛ آنجا نصب‌کننده‌ای دوباره اجرا نمی‌شود.</li>
        <li><b>سربرگ «سلامت سامانه» را باز کنید.</b> هرچه قرمز بود همان‌جا نوشته چطور درست می‌شود.</li>
        <li><b>ورود را امتحان کنید</b> — <a href="../">صفحهٔ پنل آموزشگاه‌ها</a>، شمارهٔ موبایل خودتان.
          کد در سربرگ «ورود و پیامک» پنل سوپرادمین ظاهر می‌شود.</li>
      </ol>
    </div>
  </div>

  <div class="note note--w">
    <b>پیامک هنوز روشن نیست.</b> سامانه در «حالت پل» است: همه‌چیز کار می‌کند،
    ولی کد ورود به‌جای پیامک در پنل سوپرادمین دیده می‌شود. وقتی قالب sms.ir تأیید شد،
    کلید و شناسهٔ قالب را در سربرگ «ورود و پیامک» بگذارید و حالت را عوض کنید.
    نیازی به دست‌زدن به هیچ فایلی نیست.
  </div>`;
}

/* ── نصب‌شده ── */
function viewInstalled(){
  return h`
  <div class="card">
    <div class="card-h"><h2>تاکورا از قبل نصب شده</h2></div>
    <div class="card-b">
      <p>نصب‌کننده بسته است و هیچ کاری انجام نمی‌دهد.</p>
      <p style="margin-block-start:12px"><b>پوشهٔ <code>setup</code> را از روی هاست پاک کنید.</b></p>
      <p class="mut" style="margin-block-start:12px">
        اگر می‌خواهید از نو نصب کنید، فایل پیکربندی
        (<code>private/talkora-config.php</code> یا <code>api/config.php</code>) را پاک کنید.
        این کار سامانه را تا پایان نصب تازه از کار می‌اندازد.</p>
      <div class="row" style="margin-block-start:16px">
        <a class="btn btn--p" href="https://admin.talkora.ir/" target="_blank" rel="noopener">پنل سوپرادمین</a>
        <a class="btn btn--g" href="../">پنل آموزشگاه‌ها</a>
      </div>
    </div>
  </div>`;
}

function render(){
  steps();
  el("app").innerHTML=S.installed?viewInstalled()
    :S.step===1?viewProbe():S.step===2?viewDb():S.step===3?viewAdmin():viewDone();
}

/* هر تایپ مستقیم در S می‌نشیند، پس render هیچ‌وقت چیزی را پاک نمی‌کند */
document.addEventListener("input",function(e){
  var f=e.target.dataset&&e.target.dataset.f;
  if(!f)return;
  var parts=f.split(".");
  S[parts[0]][parts[1]]=e.target.value;
});

function dbPayload(){
  return {host:(S.db.host||"localhost").trim(),name:S.db.name.trim(),
          user:S.db.user.trim(),pass:S.db.pass};
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");
  if(!b)return;
  var a=b.dataset.a;

  if(a==="go2"){S.step=2;S.err="";render();return;}
  if(a==="go3"){S.step=3;S.err="";render();return;}

  if(a==="test"){
    if(S.busy)return;
    var db=dbPayload();
    if(!db.name||!db.user){S.err="نام پایگاه داده و نام کاربری لازم است.";render();return;}
    S.busy=true;S.err="";S.dbInfo=null;render();
    call({action:"testDb",db:db}).then(function(r){
      S.busy=false;
      if(r.installed){S.installed=true;render();return;}
      if(!r.ok){S.err=r.message||"اتصال برقرار نشد.";render();return;}
      S.dbInfo=r; S.err=""; render();
    });
    return;
  }

  if(a==="install"){
    if(S.busy)return;
    var u=S.ad.user.trim().toLowerCase();
    var p=S.ad.pass, p2=S.ad.pass2;
    var body={action:"run",db:dbPayload(),username:u,password:p,
      fullName:S.ad.name.trim(),email:S.ad.email.trim(),phone:S.ad.phone.trim()};

    var skipAdmin=S.dbInfo&&S.dbInfo.admins>0;
    if(!skipAdmin){
      if(!/^[a-z0-9._-]{3,64}$/.test(u)){S.err="نام کاربری فقط حروف انگلیسی کوچک، رقم، نقطه و خط تیره.";render();return;}
      if(p.length<10){S.err="رمز باید حداقل ۱۰ نویسه باشد.";render();return;}
      if(p!==p2){S.err="تکرار رمز با خودش نمی‌خواند.";render();return;}
    }
    S.busy=true;S.err="";render();
    call(body).then(function(r){
      S.busy=false;
      if(r.installed){S.installed=true;render();return;}
      if(!r.ok){S.err=r.message||"نصب کامل نشد.";render();return;}
      S.done=r;S.step=4;render();
    });
    return;
  }
});

document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||e.target.tagName!=="INPUT")return;
  var btn=document.querySelector("[data-a='test'],[data-a='install']");
  if(btn)btn.click();
});

call({action:"probe"}).then(function(r){
  if(r.installed){S.installed=true;render();return;}
  if(!r.ok){
    el("app").innerHTML='<div class="note note--e">'+esc(r.message||"بررسی سرور ممکن نشد.")+'</div>';
    return;
  }
  S.probe=r;render();
});
})();
</script>
</body>
</html>
